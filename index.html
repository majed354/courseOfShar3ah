            const degrees = [...new Set(programsData.programs.map(p => canonicalDegreeLabel(p.degree)).filter(Boolean))];
            const tabsContainer = document.getElementById('degreeTabs');
            tabsContainer.innerHTML = `
                <button class="degree-tab ${activeDegreeFilter === 'all' ? 'active' : ''}" data-degree="all">الكل</button>
                ${degrees.map(d => `<button class="degree-tab ${activeDegreeFilter === d ? 'active' : ''}" data-degree="${escapeHtml(d)}">${escapeHtml(d)}</button>`).join('')}
            `;

            tabsContainer.querySelectorAll('.degree-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    renderPrograms(tab.dataset.degree);
                });
            });

            renderPrograms(activeDegreeFilter);
        }

        function renderPrograms(degreeFilter = activeDegreeFilter) {
            if (!programsData || !Array.isArray(programsData.programs)) return;
            activeDegreeFilter = degreeFilter;

            document.querySelectorAll('#degreeTabs .degree-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.degree === activeDegreeFilter);
            });

            const allWithIndex = programsData.programs.map((program, index) => ({ program, index }));
            const filtered = activeDegreeFilter === 'all'
                ? allWithIndex
                : allWithIndex.filter(({ program }) => canonicalDegreeLabel(program.degree) === activeDegreeFilter);

            const grid = document.getElementById('programsGrid');
            if (!filtered.length) {
                grid.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">📚</div>
                        <p>لا توجد برامج في هذا التصنيف</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(({ program, index }) => {
                const planType = normalizeText(program.plan_type) || 'غير محددة';
                const planClass = planType === 'جديدة' ? 'plan-new' : 'plan-old';
                const courseCount = Array.isArray(program.courses) ? program.courses.length : 0;
                return `
                    <div class="program-card" onclick="openProgramModal(${index})">
                        <div class="program-header">
                            <span class="program-degree-badge">${escapeHtml(canonicalDegreeLabel(program.degree))}</span>
                            <div class="program-name">${escapeHtml(program.name)}</div>
                            ${program.name_en ? `<div class="program-name-en">${escapeHtml(program.name_en)}</div>` : ''}
                        </div>
                        <div class="program-body">
                            <div class="program-stats">
                                <div class="program-stat">
                                    <span class="program-stat-value">${escapeHtml(program.total_hours)}</span>
                                    <span class="program-stat-label">ساعة</span>
                                </div>
                                <div class="program-stat">
                                    <span class="program-stat-value">${courseCount}</span>
                                    <span class="program-stat-label">مقرر</span>
                                </div>
                                <div class="program-stat">
                                    <span class="program-stat-value">${escapeHtml(program.version)}</span>
                                    <span class="program-stat-label">إصدار</span>
                                </div>
                            </div>
                            <div class="program-footer">
                                <span class="program-plan-badge ${planClass}">
                                    الخطة ${escapeHtml(planType)}
                                </span>
                                <span class="view-btn">
                                    عرض التفاصيل
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                                    </svg>
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsCount = document.getElementById('resultsCount');
        let searchTimeout;

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(performSearch, 300);
        });

        function performSearch() {
            if (!programsData || !Array.isArray(programsData.programs)) return;
            const queryRaw = searchInput.value.trim();
            const query = queryRaw.toLowerCase();
            if (query.length < 2) {
                searchResults.classList.remove('active');
                lastSearchResults = [];
                return;
            }

            const grouped = new Map();
            programsData.programs.forEach((program, programIndex) => {
                (program.courses || []).forEach((course, courseIndex) => {
                    const nameAr = normalizeText(course.name).toLowerCase();
                    const code = normalizeText(course.code).toLowerCase();
                    const nameEn = normalizeText(course.name_en).toLowerCase();
                    const isMatch = nameAr.includes(query) || code.includes(query) || (nameEn && nameEn.includes(query));
                    if (!isMatch) return;

                    const key = getCourseIdentityKey(course.code, course.name);
                    if (!grouped.has(key)) {
                        grouped.set(key, {
                            code: course.code,
                            name: course.name,
                            name_en: course.name_en || null,
                            hours: course.hours,
                            type: course.type,
                            occurrences: [],
                            catalog_only: false
                        });
                    }
                    grouped.get(key).occurrences.push({
                        program: normalizeText(program.name),
                        degree: canonicalDegreeLabel(program.degree),
                        plan_type: normalizeText(program.plan_type),
                        version: normalizeText(program.version),
                        category: course.category || null,
                        programIndex,
                        courseIndex
                    });
                });
            });

            (programsData.courses_catalog || []).forEach(course => {
                if (!course || !course.catalog_only) return;
                const nameAr = normalizeText(course.name).toLowerCase();
                const code = normalizeText(course.code).toLowerCase();
                const nameEn = normalizeText(course.name_en).toLowerCase();
                const aliases = Array.isArray(course.aliases)
                    ? course.aliases.map(alias => normalizeText(alias).toLowerCase()).filter(Boolean)
                    : [];
                const isMatch = nameAr.includes(query) || code.includes(query) ||
                    (nameEn && nameEn.includes(query)) || aliases.some(alias => alias.includes(query));
                if (!isMatch) return;

                const key = getCourseIdentityKey(course.code, course.name);
                if (grouped.has(key)) return;
                grouped.set(key, {
                    code: course.code,
                    name: course.name,
                    name_en: course.name_en || null,
                    hours: course.hours,
                    type: course.type,
                    occurrences: [],
                    catalog_only: true,
                    catalog_requirement: normalizeText(course.requirement || course.category),
                    catalog_category: normalizeText(course.category)
                });
            });

            const results = Array.from(grouped.values()).map(item => {
                const programGroups = groupProgramsForCourse(item.occurrences);
                const reqSet = new Set(item.occurrences.map(o => requirementFromCategory(o.category)));
                const catSet = new Set(item.occurrences.map(o => normalizeText(o.category)).filter(Boolean));
                if (!reqSet.size && item.catalog_requirement) reqSet.add(item.catalog_requirement);
                if (!catSet.size && item.catalog_category) catSet.add(item.catalog_category);
                const uniqueRefs = [];
                const seenRefs = new Set();

                item.occurrences.forEach(o => {
                    const key = `${o.programIndex}:${o.courseIndex}`;
                    if (seenRefs.has(key)) return;
                    seenRefs.add(key);
                    uniqueRefs.push({
                        program: o.program,
                        degree: o.degree,
                        plan_type: o.plan_type,
                        version: o.version || '',
                        category: o.category || null,
                        programIndex: o.programIndex,
                        courseIndex: o.courseIndex
                    });
                });

                const equivalentContexts = getEquivalentContextsForSearch(item.code, uniqueRefs, item.name);
                const courseDetailContexts = getCourseDetailContextsForSearch(item.code, uniqueRefs, item.name);

                return {
                    ...item,
                    program_groups: programGroups,
                    programs_count: programGroups.length,
                    occurrence_refs: uniqueRefs,
                    equivalent_contexts: equivalentContexts,
                    course_detail_contexts: courseDetailContexts,
                    course_details: courseDetailContexts.length ? courseDetailContexts[0].details : null,
                    requirement_summary: reqSet.size === 0
                        ? null
                        : (reqSet.size === 1 ? Array.from(reqSet)[0] : 'يختلف حسب البرنامج'),
                    category_summary: catSet.size === 0 ? null : (catSet.size === 1 ? Array.from(catSet)[0] : 'يختلف حسب البرنامج')
                };
            });

            lastSearchResults = results;
            displayResults(results);
        }

        function displayResults(results) {
            searchResults.classList.add('active');
            resultsCount.textContent = `${results.length} نتيجة`;

            if (!results.length) {
                resultsContainer.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <p>لم يتم العثور على نتائج</p>
                        <p style="font-size:0.85rem;">جرب البحث بكلمات مختلفة</p>
                    </div>
                `;
                return;
            }

            resultsContainer.innerHTML = results.map((result, resultIndex) => {
                const occurrenceRefs = Array.isArray(result.occurrence_refs) ? result.occurrence_refs : [];
                const visibleProgramRefs = occurrenceRefs.slice(0, 2);
                const programsHtml = visibleProgramRefs.map((ref, refIndex) => {
                    const chipClass = chipClassForPlans([ref.plan_type]);
                    const planLabel = ref.plan_type ? `الخطة ${ref.plan_type}` : '';
                    return `
                        <button type="button" class="program-chip ${chipClass}" onclick="openProgramFromSearch(${resultIndex}, ${refIndex}, event)" title="فتح الخطة عند هذا المقرر">
                            <span class="chip-name">${escapeHtml(ref.program)}</span>
                            <span class="chip-degree">${escapeHtml(ref.degree)}</span>
                            ${planLabel ? `<span class="chip-plans">${escapeHtml(planLabel)}</span>` : ''}
                        </button>
                    `;
                }).join('');
                const hiddenProgramsCount = Math.max(0, occurrenceRefs.length - visibleProgramRefs.length);
                const hasEquivalency = Array.isArray(result.equivalent_contexts) && result.equivalent_contexts.length > 0;
                const detailContexts = Array.isArray(result.course_detail_contexts) ? result.course_detail_contexts : [];
                const warningDetails = detailContexts
                    .map(contextInfo => contextInfo.details)
                    .find(details => getSpecificationPublicWarning(details));
                const specificationWarningHtml = renderSpecificationWarningChip(warningDetails);
                const pdfButtonHtml = detailContexts.length === 1
                    ? renderCoursePdfButton(detailContexts[0].details, 'التوصيف', detailContexts[0].download_label)
                    : (detailContexts.length > 1 ? `
                        <button type="button" class="course-pdf-btn${warningDetails ? ' warning' : ''}" onclick="event.stopPropagation(); openCourseDetailsFromSearch(${resultIndex})" title="عرض ملفات التوصيف" aria-label="عرض ${detailContexts.length} توصيفات للمقرر">
                            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm1 7V3.5L19.5 9H15z"/>
                            </svg>
                            التوصيفات (${detailContexts.length})
                        </button>
                    ` : '');
                const categoryLabel = result.category_summary && result.category_summary !== 'يختلف حسب البرنامج'
                    ? result.category_summary
                    : (result.requirement_summary && result.requirement_summary !== 'يختلف حسب البرنامج'
                        ? result.requirement_summary
                        : '');

                return `
                    <div class="result-item course-details-target" tabindex="0" aria-label="عرض تفاصيل ${escapeHtml(result.name)}" onclick="openCourseDetailsFromSearch(${resultIndex})" onkeydown="handleCourseDetailsKeydown(event, ${resultIndex})">
                        <div class="result-course-header">
                            <div class="result-course-name" dir="auto">${escapeHtml(result.name)}</div>
                            ${pdfButtonHtml ? `<div class="result-course-actions">${pdfButtonHtml}</div>` : ''}
                        </div>
                        <div class="result-meta">
                            <span class="result-tag"><code class="course-code">${escapeHtml(result.code)}</code></span>
                            <span class="result-tag">${escapeHtml(result.hours)} ساعة</span>
                            ${categoryLabel ? `<span class="result-tag">${escapeHtml(categoryLabel)}</span>` : ''}
                            ${result.catalog_only ? '<span class="result-tag">فهرس المقررات</span>' : ''}
                            ${specificationWarningHtml}
                            ${hasEquivalency ? '<span class="equivalency-status-chip has-equivalency">معادلة</span>' : ''}
                        </div>
                        ${(programsHtml || hiddenProgramsCount) ? `
                            <div class="result-programs">
                                ${programsHtml}
                                ${hiddenProgramsCount ? `<span class="result-more-programs">+${hiddenProgramsCount} من الخطط</span>` : ''}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function clearSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = null;
            searchInput.value = '';
            searchResults.classList.remove('active');
            resultsContainer.innerHTML = '';
            resultsCount.textContent = '0 نتيجة';
            lastSearchResults = [];
            searchInput.focus();
        }

        function handleCourseDetailsKeydown(evt, resultIndex) {
            if (evt.target !== evt.currentTarget) return;
            if (evt.key === 'Enter' || evt.key === ' ') {
                evt.preventDefault();
                openCourseDetailsFromSearch(resultIndex);
            }
        }

        function openCourseDetailsFromSearch(resultIndex) {
            const result = lastSearchResults[resultIndex];
            if (!result) return;
            openCourseDetails(result);
        }

        function openProgramFromSearch(resultIndex, referenceIndex, evt) {
            if (evt) evt.stopPropagation();
            const result = lastSearchResults[resultIndex];
            if (!result || !Array.isArray(result.occurrence_refs)) return;
            const target = result.occurrence_refs[referenceIndex];
            if (!target) return;

            openProgramModal(target.programIndex, target.courseIndex);
        }

        function renderCourseDetailEquivalencies(equivalentContexts) {
            if (!Array.isArray(equivalentContexts) || !equivalentContexts.length) {
                return '';
            }

            const contextsHtml = equivalentContexts.map(contextInfo => {
                const optionsHtml = (contextInfo.options || []).map((option, optionIndex) => {
                    const separator = optionIndex > 0 ? '<span class="equivalent-or">أو</span>' : '';
                    return `${separator}<span class="equivalent-chip">${escapeHtml(option.label)}</span>`;
                }).join('');

                return `
                    <div class="equivalent-context-line">
                        <span class="equivalent-context-label">${escapeHtml(contextInfo.context_label)}:</span>
                        <span class="equivalent-context-options">${optionsHtml}</span>
                    </div>
                `;
            }).join('');

            return `
                <div class="course-detail-section">
                    <h4 class="course-detail-heading">المعادلات</h4>
                    <div class="equivalent-context-list">${contextsHtml}</div>
                </div>
            `;
        }

        function renderCourseSummaryContexts(detailContexts) {
            const summaryContexts = (detailContexts || []).filter(contextInfo =>
                normalizeText(contextInfo && contextInfo.details && contextInfo.details.summary)
            );
            if (!summaryContexts.length) return '';

            const summariesHtml = summaryContexts.map(contextInfo => {
                const details = contextInfo.details || {};
                const summary = normalizeText(details.summary);
                return `
                    <div class="course-detail-variant">
                        ${summaryContexts.length > 1 && contextInfo.context_label ? `<span class="course-detail-scope">${escapeHtml(contextInfo.context_label)}</span>` : ''}
                        <p class="course-detail-summary">${escapeHtml(summary)}</p>
                    </div>
                `;
            }).join('');

            return `
                <div class="course-detail-section">
                    <h4 class="course-detail-heading">نبذة المقرر</h4>
                    ${summariesHtml}
                </div>
            `;
        }

        function renderCourseSpecificationContexts(detailContexts) {
            if (!detailContexts.length) {
                return `
                    <div class="course-detail-section">
                        <h4 class="course-detail-heading">التوصيف</h4>
                        <p class="course-detail-empty">لا يتوفر ملف توصيف لهذا المقرر.</p>
                    </div>
                `;
            }

            const publicWarnings = Array.from(new Set(
                detailContexts.map(contextInfo => getSpecificationPublicWarning(contextInfo.details || {})).filter(Boolean)
            ));
            const variantsHtml = detailContexts.map(contextInfo => {
                const details = contextInfo.details || {};
                const safePdfUrl = sanitizeResourceUrl(details.pdf_url);
                return `
                    <div class="course-detail-variant">
                        ${detailContexts.length > 1 && contextInfo.context_label ? `<span class="course-detail-scope">${escapeHtml(contextInfo.context_label)}</span>` : ''}
                        ${safePdfUrl ? `<div class="course-detail-actions">${renderCoursePdfButton(details, 'تحميل التوصيف', contextInfo.download_label)}</div>` : ''}
                    </div>
                `;
            }).join('');

            return `
                <div class="course-detail-section">
                    <h4 class="course-detail-heading">التوصيف</h4>
                    ${publicWarnings.map(warning => `<div class="course-detail-public-warning">${escapeHtml(warning)}</div>`).join('')}
                    ${variantsHtml}
                </div>
            `;
        }

        function openCourseDetails(result) {
            if (!result) return;

            let detailContexts = Array.isArray(result.course_detail_contexts) ? result.course_detail_contexts : [];
            if (!detailContexts.length && result.course_details) {
                detailContexts = [{
                    details: result.course_details,
                    context_label: courseDetailHasScope(result.course_details)
                        ? getCourseDetailScopes(result.course_details).map(scope => buildEquivalencyContextLabel(scope)).join('؛ ')
                        : '',
                    download_label: 'التوصيف'
                }];
            }
            const primaryDetails = detailContexts.length ? detailContexts[0].details : null;
            const equivalentContexts = Array.isArray(result.equivalent_contexts) ? result.equivalent_contexts : [];
            const refs = Array.isArray(result.occurrence_refs) ? result.occurrence_refs : [];
            const programsHtml = refs.map(ref => {
                const chipClass = chipClassForPlans([ref.plan_type]);
                const planLabel = ref.plan_type ? `الخطة ${ref.plan_type}` : '';
                return `
                    <button type="button" class="program-chip ${chipClass}" onclick="openProgramFromCourseDetails(${ref.programIndex}, ${ref.courseIndex})">
                        <span class="chip-name">${escapeHtml(ref.program)}</span>
                        <span class="chip-degree">${escapeHtml(ref.degree)}</span>
                        ${planLabel ? `<span class="chip-plans">${escapeHtml(planLabel)}</span>` : ''}
                    </button>
                `;
            }).join('');

            const specificationHtml = renderCourseSpecificationContexts(detailContexts);
            const title = normalizeText(result.name || (primaryDetails && primaryDetails.title) || result.code || 'تفاصيل المقرر');
            const courseDetailsTitle = document.getElementById('courseDetailsTitle');
            const courseDetailsBody = document.getElementById('courseDetailsBody');

            courseDetailsTitle.textContent = title;
            courseDetailsBody.innerHTML = `
                <div class="course-detail-meta">
                    <span class="result-tag"><code class="course-code">${escapeHtml(result.code || '')}</code></span>
                    ${result.hours !== undefined ? `<span class="result-tag">${escapeHtml(result.hours)} ساعة</span>` : ''}
                    ${result.type ? `<span class="result-tag">${escapeHtml(result.type)}</span>` : ''}
                    ${result.requirement_summary ? `<span class="result-tag">${escapeHtml(result.requirement_summary)}</span>` : ''}
                </div>
                ${renderCourseSummaryContexts(detailContexts)}
                ${renderCourseDetailEquivalencies(equivalentContexts)}
                ${specificationHtml}
                ${programsHtml ? `
                    <div class="course-detail-section">
                        <h4 class="course-detail-heading">ظهور المقرر في الخطط</h4>
                        <div class="result-programs">${programsHtml}</div>
                    </div>
                ` : ''}
            `;

            lastCourseDetailsTrigger = document.activeElement;
            const overlay = document.getElementById('courseDetailsOverlay');
            overlay.classList.add('active');
            overlay.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            requestAnimationFrame(() => {
                const closeButton = overlay.querySelector('.modal-close');
                if (closeButton) closeButton.focus();
            });
        }

        function openCourseDetailsFromProgram(courseIndex) {
            const program = getCurrentProgram();
            if (!program || !program.courses || !program.courses[courseIndex]) return;

            const course = program.courses[courseIndex];
            const context = buildProgramContext(program);
            const equivalentOptions = getEquivalentOptionsForContext(course.code, context, course.name);
            const courseDetailContexts = getCourseDetailContextsForSearch(course.code, [context], course.name);
            const equivalentContexts = equivalentOptions.length ? [{
                context_label: buildEquivalencyContextLabel(context),
                options: equivalentOptions
            }] : [];

            openCourseDetails({
                code: course.code,
                name: course.name,
                hours: course.hours,
                type: course.type,
                requirement_summary: requirementFromCategory(course.category),
                category_summary: course.category || null,
                course_detail_contexts: courseDetailContexts,
                course_details: courseDetailContexts.length ? courseDetailContexts[0].details : null,
                equivalent_contexts: equivalentContexts,
                occurrence_refs: [{
                    program: normalizeText(program.name),
                    degree: canonicalDegreeLabel(program.degree),
                    plan_type: normalizeText(program.plan_type),
                    version: normalizeText(program.version),
                    category: course.category || null,
                    programIndex: currentProgramIndex,
                    courseIndex
                }]
            });
        }

        function handleCourseRowKeydown(evt, courseIndex) {
            if (evt.key === 'Enter' || evt.key === ' ') {
                evt.preventDefault();
                openCourseDetailsFromProgram(courseIndex);
            }
        }

        function openProgramFromCourseDetails(programIndex, courseIndex) {
            closeCourseDetailsModal();
            openProgramModal(programIndex, courseIndex);
        }

        function closeCourseDetailsModal() {
            const overlay = document.getElementById('courseDetailsOverlay');
            overlay.classList.remove('active');
            overlay.setAttribute('aria-hidden', 'true');

            const planModalIsOpen = document.getElementById('modalOverlay').classList.contains('active');
            document.body.style.overflow = planModalIsOpen ? 'hidden' : '';

            if (lastCourseDetailsTrigger && document.contains(lastCourseDetailsTrigger)) {
                lastCourseDetailsTrigger.focus();
            }
            lastCourseDetailsTrigger = null;
        }

        function splitCoursesByLocation(program) {
            const coursesByLevel = {};
            const outsideOptionals = [];

            (program.courses || []).forEach((course, courseIndex) => {
                const item = { course, courseIndex };
                if (isOutsideLevelElective(course)) {
                    outsideOptionals.push(item);
                    return;
                }
                const level = Math.max(1, Math.round(toNumber(course.level, 1)));
                if (!coursesByLevel[level]) {
                    coursesByLevel[level] = [];
                }
                coursesByLevel[level].push(item);
            });

            const levelNumbers = Object.keys(coursesByLevel).map(Number).sort((a, b) => a - b);
            return { coursesByLevel, outsideOptionals, levelNumbers };
        }

        function sumCourseHours(items) {
            return (items || []).reduce((sum, item) => sum + toNumber(item.course && item.course.hours, 0), 0);
        }

        function renderCourseRow(item) {
            const course = item.course || {};
            const courseIndex = item.courseIndex;
            const inOutsidePool = isOutsideLevelElective(course);
            const levelValue = Math.max(1, Math.round(toNumber(course.level, 1)));
            const typeValue = normalizeText(course.type) || 'نظري';
            const programContext = buildProgramContext(getCurrentProgram() || {});
            const equivalentList = getEquivalentOptionsForContext(course.code, programContext, course.name);
            const equivalentMeta = equivalentList.map(eq => eq.label).join(' أو ');
            const rowClass = highlightedCourseIndex === courseIndex ? 'course-row-highlight' : '';

            if (!editModeEnabled) {
                return `
                    <tr class="${rowClass} course-row-clickable" data-course-index="${courseIndex}" tabindex="0" onclick="openCourseDetailsFromProgram(${courseIndex})" onkeydown="handleCourseRowKeydown(event, ${courseIndex})" aria-label="عرض تفاصيل ${escapeHtml(course.name)}">
                        <td><code class="course-code">${escapeHtml(course.code)}</code></td>
                        <td>
                            <strong dir="auto">${escapeHtml(course.name)}</strong>
                            ${course.name_en ? `<br><small dir="ltr" lang="en" style="color:var(--text-muted)">${escapeHtml(course.name_en)}</small>` : ''}
                            ${course.category ? `<span class="course-meta">${escapeHtml(course.category)}</span>` : ''}
                            ${equivalentMeta ? `<span class="course-meta">يعادل: ${escapeHtml(equivalentMeta)}</span>` : ''}
                        </td>
                        <td>${escapeHtml(course.hours)}</td>
                        <td><span class="course-type-badge ${getCourseTypeClass(typeValue)}">${escapeHtml(typeValue)}</span></td>
                    </tr>
                `;
            }

            return `
                <tr class="${rowClass}" data-course-index="${courseIndex}">
                    <td>
                        <input class="edit-input" value="${escapeHtml(course.code)}" placeholder="رمز المقرر" onchange="setCourseField(${courseIndex}, 'code', this.value)">
                    </td>
                    <td>
                        <input class="edit-input" value="${escapeHtml(course.name)}" placeholder="اسم المقرر" onchange="setCourseField(${courseIndex}, 'name', this.value)">
                        <input class="edit-input" value="${escapeHtml(course.name_en || '')}" placeholder="الاسم بالإنجليزية" onchange="setCourseField(${courseIndex}, 'name_en', this.value)">
                        <input class="edit-input" value="${escapeHtml(course.category || '')}" placeholder="التصنيف" onchange="setCourseField(${courseIndex}, 'category', this.value)">
                        ${renderEquivalencyEditor(course, courseIndex)}
                    </td>
                    <td>
                        <input type="number" min="0" step="1" class="edit-input" value="${toNumber(course.hours, 0)}" onchange="setCourseField(${courseIndex}, 'hours', this.value)">
                    </td>
                    <td>
                        <input class="edit-input" value="${escapeHtml(typeValue)}" placeholder="نوع المقرر" onchange="setCourseField(${courseIndex}, 'type', this.value)">
                    </td>
                    <td>
                        <div class="row-actions">
                            <div class="action-inline">
                                <span>المستوى</span>
                                <select class="edit-select" onchange="moveCourseLevel(${courseIndex}, this.value)">
                                    ${levelOptionsHtml(levelValue)}
                                </select>
                            </div>
                            <label class="action-inline">
                                <input type="checkbox" ${inOutsidePool ? 'checked' : ''} onchange="setCourseOutsidePool(${courseIndex}, this.checked)">
                                خارج المستويات
                            </label>
                            <button type="button" class="mini-btn" onclick="removeCourse(${courseIndex})">حذف</button>
                        </div>
                    </td>
                </tr>
            `;
        }

        function renderCoursesTable(items, emptyLabel) {
            const colCount = editModeEnabled ? 5 : 4;
            return `
                <table class="courses-table">
                    <thead>
                        <tr>
                            <th>رمز المقرر</th>
                            <th>اسم المقرر</th>
                            <th>الساعات</th>
                            <th>النوع</th>
                            ${editModeEnabled ? '<th>إجراءات</th>' : ''}
                        </tr>
                    </thead>
                    <tbody>
                        ${items.length
                            ? items.map(renderCourseRow).join('')
                            : `<tr><td colspan="${colCount}" style="text-align:center;color:var(--text-muted);">${escapeHtml(emptyLabel)}</td></tr>`
                        }
                    </tbody>
                </table>
            `;
        }

        function renderCurrentProgramModal() {
            const program = getCurrentProgram();
            if (!program) return;

            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            modalTitle.textContent = `${normalizeText(program.name)} - ${canonicalDegreeLabel(program.degree)}`;

            const { coursesByLevel, outsideOptionals, levelNumbers } = splitCoursesByLocation(program);
            const levelItems = levelNumbers.flatMap(level => coursesByLevel[level] || []);
            const countedHours = sumCourseHours(levelItems);
            const outsideHours = sumCourseHours(outsideOptionals);
            const planHours = toNumber(program.total_hours, 0);

            let html = `
                <div class="download-actions">
                    <button class="download-btn pdf" onclick="printPlanOnly()">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z"/>
                        </svg>
                        طباعة / حفظ PDF
                    </button>
                    <button class="download-btn" style="background:#0EA5E9;color:#fff;" onclick="downloadCSV()">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm1 7V3.5L19.5 9H15zM8 13h8v2H8v-2zm0 4h8v2H8v-2z"/>
                        </svg>
                        تنزيل CSV
                    </button>
                    <button class="download-btn edit-toggle ${editModeEnabled ? 'edit-on' : ''}" onclick="toggleEditMode()">
                        ${editModeEnabled ? 'إيقاف التعديل' : 'زر التعديل'}
                    </button>
                    ${editModeEnabled ? `
                        <button class="download-btn add-course" onclick="addCourseToProgram(false)">إضافة مقرر داخل مستوى</button>
                        <button class="download-btn add-course" onclick="addCourseToProgram(true)">إضافة اختياري خارج المستويات</button>
                        <button class="download-btn save-edit" onclick="saveEditsNow()">حفظ التعديلات</button>
                    ` : ''}
                </div>
            `;

            if (editModeEnabled) {
                html += `
                    <div class="edit-help">
                        وضع التعديل مفعّل: يمكنك تعديل اسم/رمز/ساعات المقرر، ونقله بين المستويات، أو تحويله إلى "اختياري خارج المستويات" غير محسوب في الساعات.
                    </div>
                `;
            }

            html += `
                <div class="modal-info">
                    <span class="modal-info-badge ${program.plan_type === 'جديدة' ? 'plan-new' : 'plan-old'}">
                        الخطة ${escapeHtml(program.plan_type)} (إصدار ${escapeHtml(program.version)})
                    </span>
                    <span class="modal-info-badge" style="background:var(--bg-light);">
                        إجمالي الساعات بالخطة: <strong>${escapeHtml(program.total_hours)}</strong>
                    </span>
                    <span class="modal-info-badge hours-compare-badge">
                        الساعات المحتسبة فعليًا: <strong>${countedHours}</strong>
                    </span>
                    <span class="modal-info-badge" style="background:#FEF3C7;color:#92400E;">
                        اختياري خارج المستويات: <strong>${outsideOptionals.length}</strong> مقرر (${outsideHours} ساعة غير محتسبة)
                    </span>
                </div>
            `;

            if (planHours && countedHours !== planHours) {
                html += `
                    <div class="optional-pool-note">
                        ملاحظة: ساعات المقررات الاختيارية خارج المستويات لا تدخل في حساب "الساعات المحتسبة فعليًا".
                    </div>
                `;
            }

            if (!levelNumbers.length) {
                html += `
                    <div class="no-results" style="padding:1.5rem 1rem;">
                        <p>لا توجد مقررات ضمن المستويات حاليًا.</p>
                    </div>
                `;
            }

            levelNumbers.forEach(level => {
                const items = coursesByLevel[level] || [];
                const levelHours = sumCourseHours(items);
                html += `
                    <div class="courses-by-level">
                        <div class="level-header">
                            <span class="level-number">${level}</span>
                            <span class="level-title">${getLevelTitle(level)}</span>
                            <span class="level-hours">${levelHours} ساعة محتسبة</span>
                        </div>
                        ${renderCoursesTable(items, 'لا توجد مقررات في هذا المستوى')}
                    </div>
                `;
            });

            html += `
                <div class="courses-by-level optional-pool-section">
                    <div class="level-header">
                        <span class="level-number">م</span>
                        <span class="level-title">مقررات اختيارية خارج المستويات</span>
                        <span class="level-hours">غير محسوبة ضمن ساعات الخطة</span>
                    </div>
                    <div class="optional-pool-note" style="margin-top:0;margin-bottom:0.75rem;">
                        هذه المقررات تمثل بنك اختيارات، يختار الطالب منها حسب متطلبات الخطة، ولا يُفترض دراسة جميعها.
                    </div>
                    ${renderCoursesTable(outsideOptionals, 'لا توجد مقررات اختيارية خارج المستويات حتى الآن')}
                </div>
            `;

            modalBody.innerHTML = html;
            if (highlightedCourseIndex !== null) {
                requestAnimationFrame(() => {
                    const targetRow = modalBody.querySelector(`[data-course-index="${highlightedCourseIndex}"]`);
                    if (targetRow) {
                        targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                });
            }
        }

        function openProgramModal(programIndex, focusCourseIndex = null) {
            const program = programsData && programsData.programs ? programsData.programs[programIndex] : null;
            if (!program) return;

            currentProgramIndex = programIndex;
            currentProgram = program;
            highlightedCourseIndex = Number.isInteger(focusCourseIndex) ? focusCourseIndex : null;
            editModeEnabled = quickEditModeEnabled;
            renderCurrentProgramModal();

            const modal = document.getElementById('modalOverlay');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function toggleEditMode() {
            const program = getCurrentProgram();
            if (!program) return;
            if (!quickEditModeEnabled) {
                if (!requestEditAccess()) return;
                setQuickEditState(true);
                return;
            }
            setQuickEditState(false);
        }

        function setCourseField(courseIndex, field, value) {
            const program = getCurrentProgram();
            if (!program || !program.courses || !program.courses[courseIndex]) return;

            const course = program.courses[courseIndex];
            if (field === 'hours') {
                course.hours = Math.max(0, Math.round(toNumber(value, 0)));
            } else if (field === 'level') {
                course.level = Math.max(1, Math.round(toNumber(value, 1)));
            } else {
                course[field] = value;
            }

            if (!normalizeText(course.type)) {
                course.type = 'نظري';
            }
            if (!toNumber(course.level, 0)) {
                course.level = 1;
            }

            applyProgramMutation();
        }

        function setCourseEquivalents(courseIndex, rawValue) {
            const program = getCurrentProgram();
            if (!program || !program.courses || !program.courses[courseIndex]) return;

            const course = program.courses[courseIndex];
            const entries = splitEquivalentsInput(rawValue)
                .map(part => {
                    return parseEquivalentItem(part);
                })
                .filter(Boolean);

            saveCourseEquivalentEntries(course, entries);
            applyProgramMutation();
        }

        function moveCourseLevel(courseIndex, levelValue) {
            const program = getCurrentProgram();
            if (!program || !program.courses || !program.courses[courseIndex]) return;

            const course = program.courses[courseIndex];
            course.level = Math.max(1, Math.round(toNumber(levelValue, 1)));
            course.optional_pool = false;
            applyProgramMutation();
        }

        function setCourseOutsidePool(courseIndex, isOutside) {
            const program = getCurrentProgram();
            if (!program || !program.courses || !program.courses[courseIndex]) return;

            const course = program.courses[courseIndex];
            course.optional_pool = Boolean(isOutside);
            if (!course.level || toNumber(course.level, 0) < 1) {
                course.level = 1;
            }
            applyProgramMutation();
        }

        function addCourseToProgram(asOutsidePool) {
            const program = getCurrentProgram();
            if (!program) return;

            const serial = (program.courses ? program.courses.length : 0) + 1;
            const newCourse = {
                code: `NEW-${serial}`,
                name: asOutsidePool ? 'مقرر اختياري جديد' : 'مقرر جديد',
                name_en: '',
                hours: 2,
                level: 1,
                type: 'نظري',
                category: asOutsidePool ? 'اختيارية القسم' : 'إجبارية القسم'
            };

            if (asOutsidePool) {
                newCourse.optional_pool = true;
            }

            if (!Array.isArray(program.courses)) {
                program.courses = [];
            }
            program.courses.push(newCourse);
            applyProgramMutation();
        }

        function removeCourse(courseIndex) {
            const program = getCurrentProgram();
            if (!program || !program.courses || !program.courses[courseIndex]) return;

            const course = program.courses[courseIndex];
            const ok = confirm(`هل تريد حذف المقرر: ${normalizeText(course.name) || normalizeText(course.code)} ؟`);
            if (!ok) return;

            program.courses.splice(courseIndex, 1);
            applyProgramMutation();
        }

        function saveEditsNow() {
            saveCustomData();
            alert('تم حفظ التعديلات محليًا على هذا الجهاز.');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            const courseDetailsIsOpen = document.getElementById('courseDetailsOverlay').classList.contains('active');
            document.body.style.overflow = courseDetailsIsOpen ? 'hidden' : '';
            currentProgram = null;
            currentProgramIndex = null;
            highlightedCourseIndex = null;
            editModeEnabled = false;
        }

        document.getElementById('modalOverlay').addEventListener('click', e => {
            if (e.target.id === 'modalOverlay') {
                closeModal();
            }
        });

        document.getElementById('courseDetailsOverlay').addEventListener('click', e => {
            if (e.target.id === 'courseDetailsOverlay') {
                closeCourseDetailsModal();
            }
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                const courseDetailsOverlay = document.getElementById('courseDetailsOverlay');
                if (courseDetailsOverlay.classList.contains('active')) {
                    closeCourseDetailsModal();
                    return;
                }
                if (document.getElementById('modalOverlay').classList.contains('active')) {
                    closeModal();
                }
            }
        });

        function printPlanOnly() {
            if (!getCurrentProgram()) {
                alert('لم يتم تحديد برنامج');
                return;
            }
            document.body.classList.add('print-plan');
            setTimeout(() => {
                window.print();
            }, 50);
        }

        window.addEventListener('afterprint', () => {
            document.body.classList.remove('print-plan');
        });

        function downloadCSV() {
            const program = getCurrentProgram();
            if (!program) {
                alert('لم يتم تحديد برنامج');
                return;
            }

            const safePlan = program.plan_type === 'جديدة' ? 'new' : (program.plan_type === 'قديمة' ? 'old' : 'plan');
            const safeName = (program.name_en || program.name).toString()
                .replace(/[^a-zA-Z0-9]+/g, '_')
                .replace(/^_+|_+$/g, '') || 'plan';
            const fileName = `${safeName}_${safePlan}.csv`;

            const rows = [
                ['Program', (program.name_en || program.name)],
                ['Degree', canonicalDegreeLabel(program.degree)],
                ['Plan', program.plan_type],
                ['Version', program.version],
                ['Total Hours', program.total_hours],
                [],
                ['Level', 'Code', 'Course Name', 'English Name', 'Hours', 'Type', 'Category', 'Equivalent Courses', 'Optional Pool', 'Counted In Hours']
            ];
            const context = buildProgramContext(program);

            (program.courses || []).forEach(course => {
                const outside = isOutsideLevelElective(course);
                const equivalentsText = getEquivalentOptionsForContext(course.code, context, course.name).map(eq => eq.label).join(' | ');
                rows.push([
                    outside ? 'Outside Elective Pool' : Math.max(1, Math.round(toNumber(course.level, 1))),
                    course.code ?? '',
                    course.name ?? '',
                    course.name_en ?? '',
                    course.hours ?? '',
                    course.type ?? '',
                    course.category ?? '',
                    equivalentsText,
                    outside ? 'Yes' : 'No',
                    outside ? 'No' : 'Yes'
                ]);
            });

            const csv = rows.map(r => r.map(v => {
                const s = (v === null || v === undefined) ? '' : String(v);
                return `"${s.replace(/"/g, '""')}"`;
            }).join(',')).join('\n');

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                URL.revokeObjectURL(url);
                a.remove();
            }, 1000);
        }

        function downloadAllCSV() {
            if (!programsData || !programsData.programs || !programsData.programs.length) {
                alert('لا توجد بيانات لتحميلها');
                return;
            }

            const rows = [[
                'Program',
                'Program EN',
                'Degree',
                'Plan',
                'Version',
                'Total Hours',
                'Level',
                'Code',
                'Course Name',
                'English Name',
                'Hours',
                'Type',
                'Category',
                'Equivalent Courses',
                'Optional Pool',
                'Counted In Hours'
            ]];

            programsData.programs.forEach(program => {
                const programName = (program.name_en || program.name || '');
                const degree = canonicalDegreeLabel(program.degree);
                const planType = program.plan_type || '';
                const version = program.version || '';
                const totalHours = program.total_hours || '';
                const courses = (program.courses || []);
                const context = buildProgramContext(program);

                if (!courses.length) {
                    rows.push([programName, (program.name_en || ''), degree, planType, version, totalHours, '', '', '', '', '', '', '', '', '', '']);
                    return;
                }

                courses.forEach(course => {
                    const outside = isOutsideLevelElective(course);
                    const equivalentsText = getEquivalentOptionsForContext(course.code, context, course.name).map(eq => eq.label).join(' | ');
                    rows.push([
                        programName,
                        (program.name_en || ''),
                        degree,
                        planType,
                        version,
                        totalHours,
                        outside ? 'Outside Elective Pool' : (course.level ?? ''),
                        (course.code ?? ''),
                        (course.name ?? ''),
                        (course.name_en ?? ''),
                        (course.hours ?? ''),
                        (course.type ?? ''),
                        (course.category ?? ''),
                        equivalentsText,
                        outside ? 'Yes' : 'No',
                        outside ? 'No' : 'Yes'
                    ]);
                });
            });

            const csv = rows.map(r => r.map(v => {
                const s = (v === null || v === undefined) ? '' : String(v);
                return `"${s.replace(/"/g, '""')}"`;
            }).join(',')).join('\n');

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'all_plans.csv';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                URL.revokeObjectURL(url);
                a.remove();
            }, 1000);
        }

        function downloadEditedJSON() {
            if (!programsData) {
                alert('لا توجد بيانات متاحة');
                return;
            }
            const blob = new Blob([JSON.stringify(programsData, null, 2)], {
                type: 'application/json;charset=utf-8;'
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'data-edited.json';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                URL.revokeObjectURL(url);
                a.remove();
            }, 1000);
        }

        function resetToOriginalData() {
            if (!originalProgramsData) {
                alert('البيانات الأصلية غير متوفرة');
                return;
            }
            const ok = confirm('سيتم حذف جميع التعديلات المحلية والعودة للبيانات الأصلية. هل تريد المتابعة؟');
            if (!ok) return;

            programsData = deepClone(originalProgramsData);
            sanitizeDataShape(programsData);
            rebuildCourseIndexes();
            clearCustomData();
            closeModal();
            clearSearch();
            activeDegreeFilter = 'all';
            initializeUI();
            alert('تمت استعادة البيانات الأصلية بنجاح.');
        }

        loadData();
    </script>
</body>
</html>
