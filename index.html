<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطط ومقررات كلية الشريعة والأنظمة | جامعة الطائف</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- SheetJS for Excel generation -->
<!-- jsPDF for PDF generation -->
<style>
        :root {
            --primary: #1B5E3B;
            --primary-light: #2E8B57;
            --primary-dark: #0D3D1F;
            --primary-gradient: linear-gradient(135deg, #0D3D1F 0%, #1B5E3B 50%, #2E8B57 100%);
            --accent: #D4AF37;
            --accent-light: #F4D03F;
            --accent-dark: #9A7B0A;
            --bg-cream: #FEFCF6;
            --bg-light: #F8F5ED;
            --bg-card: #FFFFFF;
            --text-dark: #1A1A1A;
            --text-medium: #4A4A4A;
            --text-muted: #6B6B6B;
            --border-light: #E8E4D9;
            --border-medium: #D5CFC0;
            --shadow-sm: 0 2px 8px rgba(27, 94, 59, 0.08);
            --shadow-md: 0 4px 16px rgba(27, 94, 59, 0.12);
            --shadow-lg: 0 8px 32px rgba(27, 94, 59, 0.16);
            --shadow-xl: 0 16px 48px rgba(27, 94, 59, 0.20);
            --radius-xs: 6px;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Kufi Arabic', sans-serif;
            background: var(--bg-cream);
            color: var(--text-dark);
            line-height: 1.8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Geometric Pattern Background */
        .geometric-pattern {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            opacity: 0.025;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%231B5E3B' stroke-width='1'%3E%3Cpath d='M40 0L80 40L40 80L0 40Z'/%3E%3Cpath d='M40 10L70 40L40 70L10 40Z'/%3E%3Cpath d='M40 20L60 40L40 60L20 40Z'/%3E%3C/g%3E%3C/svg%3E");
        }

        /* Header Section */
        header {
            background: var(--primary-gradient);
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0L60 30L30 60L0 30Z' fill='%23ffffff' fill-opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-dark), var(--accent), var(--accent-light), var(--accent), var(--accent-dark));
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 3rem;
            position: relative;
            z-index: 1;
        }

        .university-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            padding: 0.6rem 1.25rem;
            border-radius: 50px;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(255,255,255,0.18);
            font-size: 0.9rem;
            font-weight: 500;
            animation: fadeInDown 0.6s ease-out;
        }

        .university-badge svg {
            width: 28px;
            height: 28px;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Amiri', serif;
            font-size: clamp(1.75rem, 4.5vw, 3rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }

        .subtitle {
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            opacity: 0.92;
            font-weight: 400;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Stats Bar */
        .stats-bar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            padding: 0.75rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
            transition: box-shadow var(--transition-smooth);
        }

        .stats-bar.scrolled {
            box-shadow: var(--shadow-md);
        }

        .stats-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            padding: 0.5rem 1rem;
            position: relative;
        }

        .stat-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 30px;
            width: 1px;
            background: var(--border-light);
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            display: block;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Main Content */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
            position: relative;
            z-index: 1;
        }

        /* Search Section */
        .search-section {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-light);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-title {
            font-family: 'Amiri', serif;
            font-size: 1.35rem;
            color: var(--primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .search-title svg {
            width: 24px;
            height: 24px;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.25rem;
            padding-right: 3.5rem;
            font-size: 1rem;
            font-family: 'Noto Kufi Arabic', sans-serif;
            border: 2px solid var(--border-medium);
            border-radius: var(--radius-md);
            transition: all var(--transition-smooth);
            background: var(--bg-light);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-card);
            box-shadow: 0 0 0 4px rgba(27, 94, 59, 0.1);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color var(--transition-fast);
        }

        .search-input:focus + .search-icon {
            color: var(--primary);
        }

        /* Search Results */
        .search-results {
            margin-top: 1.5rem;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .search-results.active {
            display: block;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-light);
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .results-count {
            font-weight: 600;
            color: var(--primary);
            font-size: 0.95rem;
        }

        .clear-search {
            padding: 0.5rem 1rem;
            background: var(--bg-light);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--text-medium);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .clear-search:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .result-item {
            background: var(--bg-light);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            margin-bottom: 0.75rem;
            transition: all var(--transition-smooth);
        }

        .result-item:hover {
            border-color: var(--primary);
            transform: translateX(-4px);
            box-shadow: 4px 0 0 var(--accent);
        }

        .result-item.quick-edit-target {
            cursor: pointer;
        }

        .result-item.quick-edit-target::after {
            content: 'انقر للتعديل السريع';
            display: inline-block;
            margin-top: 0.55rem;
            color: #1E40AF;
            background: #DBEAFE;
            border: 1px solid #BFDBFE;
            border-radius: 999px;
            padding: 0.2rem 0.65rem;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .result-course-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }

        .result-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .result-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            background: var(--bg-card);
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid var(--border-light);
        }

        .course-code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-weight: 600;
            color: var(--primary);
            direction: ltr;
        }

        .result-programs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .program-chip {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.35rem;
            padding: 0.35rem 0.65rem;
            border-radius: var(--radius-sm);
            font-size: 0.72rem;
            border: 1px solid var(--border-light);
            background: var(--bg-card);
            color: var(--text-dark);
            line-height: 1.3;
            font-family: inherit;
            appearance: none;
            cursor: pointer;
            text-align: right;
            text-decoration: none;
        }

        .program-chip:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .program-chip .chip-degree {
            font-weight: 600;
        }

        .program-chip .chip-plans {
            font-size: 0.68rem;
            opacity: 0.85;
        }

        .program-chip.plan-new {
            background: rgba(27, 94, 59, 0.08);
            border-color: rgba(27, 94, 59, 0.2);
            color: var(--primary);
        }

        .program-chip.plan-old {
            background: rgba(212, 175, 55, 0.12);
            border-color: rgba(212, 175, 55, 0.3);
            color: var(--accent-dark);
        }

        .program-chip.plan-mixed {
            background: linear-gradient(135deg, rgba(27, 94, 59, 0.08), rgba(212, 175, 55, 0.12));
            border-color: rgba(27, 94, 59, 0.2);
        }

        .no-results {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .no-results-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Programs Section */
        .programs-section {
            margin-top: 2rem;
            animation: slideUp 0.5s ease-out 0.2s both;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-family: 'Amiri', serif;
            font-size: clamp(1.35rem, 3vw, 1.65rem);
            color: var(--primary-dark);
            white-space: nowrap;
        }

        .section-line {
            flex: 1;
            height: 2px;
            background: linear-gradient(to left, transparent, var(--accent), transparent);
        }

        /* Degree Tabs */
        .degree-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            padding: 0.5rem;
            background: var(--bg-light);
            border-radius: var(--radius-lg);
        }

        .degree-tab {
            padding: 0.65rem 1.25rem;
            border: none;
            border-radius: var(--radius-md);
            background: transparent;
            color: var(--text-medium);
            font-family: 'Noto Kufi Arabic', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-smooth);
            flex: 1;
            min-width: fit-content;
            text-align: center;
        }

        .degree-tab:hover {
            background: var(--bg-card);
            color: var(--primary);
        }

        .degree-tab.active {
            background: var(--primary);
            color: #fff;
            box-shadow: var(--shadow-sm);
        }

        /* Program Cards Grid */
        .programs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.25rem;
        }

        .program-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            transition: all var(--transition-smooth);
            cursor: pointer;
        }

        .program-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
        }

        .program-header {
            background: var(--primary-gradient);
            color: #fff;
            padding: 1.25rem;
            position: relative;
            overflow: hidden;
        }

        .program-header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .program-degree-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 0.3rem 0.85rem;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .program-name {
            font-family: 'Amiri', serif;
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .program-name-en {
            font-size: 0.8rem;
            opacity: 0.85;
            font-weight: 400;
            margin-top: 0.25rem;
        }

        .program-body {
            padding: 1.25rem;
        }

        .program-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .program-stat {
            text-align: center;
            padding: 0.6rem;
            background: var(--bg-light);
            border-radius: var(--radius-sm);
        }

        .program-stat-value {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary);
        }

        .program-stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .program-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .program-plan-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.85rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .plan-new {
            background: rgba(27, 94, 59, 0.1);
            color: var(--primary);
        }

        .plan-old {
            background: rgba(212, 175, 55, 0.15);
            color: var(--accent-dark);
        }

        .view-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.85rem;
            background: var(--bg-light);
            border: 1px solid var(--border-medium);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-medium);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
        }

        .view-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-smooth);
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow: hidden;
            transform: scale(0.95) translateY(20px);
            transition: transform var(--transition-bounce);
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            background: var(--primary-gradient);
            color: #fff;
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .modal-title {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .modal-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .modal-close:hover {
            background: rgba(255,255,255,0.3);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            flex: 1;
        }

        /* Download Buttons */
        .download-actions {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

.global-actions {
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    margin-top: 1rem;
    flex-wrap: wrap;
}

.global-actions .download-btn {
    width: auto;
}

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.25rem;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            border: none;
        }

        .download-btn svg {
            width: 18px;
            height: 18px;
        }

        .download-btn.pdf {
            background: #DC2626;
            color: #fff;
        }

        .download-btn.pdf:hover {
            background: #B91C1C;
            transform: translateY(-2px);
        }

        .download-btn.excel {
            background: #059669;
            color: #fff;
        }

        .download-btn.excel:hover {
            background: #047857;
            transform: translateY(-2px);
        }

        .download-btn.edit-toggle {
            background: #2563EB;
            color: #fff;
        }

        .download-btn.edit-toggle:hover {
            background: #1D4ED8;
            transform: translateY(-2px);
        }

        .download-btn.edit-on {
            background: #B45309;
        }

        .download-btn.save-edit {
            background: #0F766E;
            color: #fff;
        }

        .download-btn.save-edit:hover {
            background: #115E59;
            transform: translateY(-2px);
        }

        .download-btn.add-course {
            background: #334155;
            color: #fff;
        }

        .download-btn.add-course:hover {
            background: #1E293B;
            transform: translateY(-2px);
        }

        .modal-info {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .modal-info-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Course Table */
        .courses-by-level {
            margin-bottom: 1.5rem;
        }

        .level-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            padding: 0.75rem 1rem;
            background: var(--bg-light);
            border-radius: var(--radius-sm);
        }

        .level-number {
            width: 32px;
            height: 32px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .level-title {
            font-weight: 600;

    <script>
        const EDIT_PASSWORD = '140505';
        const LOCAL_STORAGE_KEY = 'courseOfShar3ah_custom_data_v2';
        const MAX_LEVEL = 12;

        let programsData = null;
        let originalProgramsData = null;
        let currentProgram = null;
        let currentProgramIndex = null;
        let activeDegreeFilter = 'all';
        let editAccessGranted = false;
        let editModeEnabled = false;
        let quickEditModeEnabled = false;
        let highlightedCourseIndex = null;
        let lastSearchResults = [];

        function deepClone(value) {
            return JSON.parse(JSON.stringify(value));
        }

        function normalizeText(s) {
            return (s || '').toString().trim().replace(/\s+/g, ' ');
        }

        function normalizePasswordInput(value) {
            const westernDigits = '0123456789';
            const arabicIndicDigits = '٠١٢٣٤٥٦٧٨٩';
            const easternArabicDigits = '۰۱۲۳۴۵۶۷۸۹';

            return normalizeText(value)
                .split('')
                .map(char => {
                    const arabicIndex = arabicIndicDigits.indexOf(char);
                    if (arabicIndex !== -1) return westernDigits[arabicIndex];

                    const easternIndex = easternArabicDigits.indexOf(char);
                    if (easternIndex !== -1) return westernDigits[easternIndex];

                    return char;
                })
                .join('')
                .replace(/\s+/g, '');
        }

        function escapeHtml(value) {
            return (value === null || value === undefined ? '' : String(value))
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function toNumber(value, fallback = 0) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : fallback;
        }

        function canonicalDegreeLabel(degree) {
            const d = normalizeText(degree);
            if (d.includes('بكال')) return 'بكالوريوس';
            if (d.includes('ماجست')) return 'ماجستير';
            if (d.includes('دكتور')) return 'دكتوراه';
            return d;
        }

        function requirementFromCategory(category) {
            const cat = normalizeText(category);
            if (!cat) return 'غير محدد';
            return cat.includes('اختياري') ? 'اختياري' : 'إجباري';
        }

        function chipClassForPlans(planTypes) {
            const set = new Set((planTypes || []).filter(Boolean));
            if (set.size > 1) return 'plan-mixed';
            const only = Array.from(set)[0];
            if (only === 'جديدة') return 'plan-new';
            if (only === 'قديمة') return 'plan-old';
            return '';
        }

        function groupProgramsForCourse(occurrences) {
            const map = new Map();
            (occurrences || []).forEach(o => {
                const key = `${normalizeText(o.program)}||${canonicalDegreeLabel(o.degree)}`;
                if (!map.has(key)) {
                    map.set(key, {
                        program: normalizeText(o.program),
                        degree: canonicalDegreeLabel(o.degree),
                        planTypes: new Set()
                    });
                }
                if (o.plan_type) map.get(key).planTypes.add(o.plan_type);
            });
            return Array.from(map.values()).map(x => ({
                program: x.program,
                degree: x.degree,
                plan_types: Array.from(x.planTypes)
            }));
        }

        function sanitizeDataShape(data) {
            if (!data || typeof data !== 'object') return { programs: [] };
            if (!Array.isArray(data.programs)) data.programs = [];
            data.programs.forEach(program => {
                if (!Array.isArray(program.courses)) {
                    program.courses = [];
                }
            });
            return data;
        }

        function readStoredData(fallbackData) {
            try {
                const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (!raw) return deepClone(fallbackData);
                const parsed = JSON.parse(raw);
                sanitizeDataShape(parsed);
                return parsed;
            } catch (error) {
                console.warn('Stored data ignored:', error);
                localStorage.removeItem(LOCAL_STORAGE_KEY);
                return deepClone(fallbackData);
            }
        }

        function saveCustomData() {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(programsData));
            } catch (error) {
                console.warn('Could not save custom data:', error);
            }
        }

        function clearCustomData() {
            localStorage.removeItem(LOCAL_STORAGE_KEY);
        }

        function isCountedElectivePlaceholder(course) {
            const text = `${normalizeText(course && course.name)} ${normalizeText(course && course.category)}`;
            return /(?:جامعي|جامعة|كلية|برنامج)\s*اختياري|اختياري\s*(?:جامعي|جامعة|كلية|برنامج)/.test(text);
        }

        function isOutsideLevelElective(course) {
            if (!course || typeof course !== 'object') return false;
            if (course.optional_pool === true) return true;
            if (course.optional_pool === false) return false;
            const category = normalizeText(course.category);
            if (!category.includes('اختيار')) return false;
            return !isCountedElectivePlaceholder(course);
        }

        function getCourseTypeClass(type) {
            if (type === 'عملي') return 'type-practical';
            if (type === 'بحث') return 'type-research';
            if (type === 'تدريب') return 'type-training';
            return 'type-theory';
        }

        function getLevelTitle(level) {
            const map = {
                1: 'المستوى الأول',
                2: 'المستوى الثاني',
                3: 'المستوى الثالث',
                4: 'المستوى الرابع',
                5: 'المستوى الخامس',
                6: 'المستوى السادس',
                7: 'المستوى السابع',
                8: 'المستوى الثامن',
                9: 'المستوى التاسع',
                10: 'المستوى العاشر',
                11: 'المستوى الحادي عشر',
                12: 'المستوى الثاني عشر'
            };
            return map[level] || `المستوى ${level}`;
        }

        function levelOptionsHtml(selectedLevel) {
            const current = Math.max(1, Math.round(toNumber(selectedLevel, 1)));
            let options = '';
            for (let level = 1; level <= MAX_LEVEL; level += 1) {
                options += `<option value="${level}" ${current === level ? 'selected' : ''}>${level}</option>`;
            }
            return options;
        }

        function getCurrentProgram() {
            if (currentProgramIndex === null || !programsData || !Array.isArray(programsData.programs)) {
                return null;
            }
            currentProgram = programsData.programs[currentProgramIndex] || null;
            return currentProgram;
        }

        function requestEditAccess() {
            if (editAccessGranted) return true;
            const entered = window.prompt('أدخل كلمة المرور لتفعيل التعديل:');
            if (entered === null) return false;
            if (normalizePasswordInput(entered) !== normalizePasswordInput(EDIT_PASSWORD)) {
                alert('كلمة المرور غير صحيحة');
                return false;
            }
            editAccessGranted = true;
            return true;
        }

        function updateFloatingEditButton() {
            const btn = document.getElementById('floatingEditBtn');
            const label = document.getElementById('floatingEditBtnLabel');
            if (!btn || !label) return;
            btn.classList.toggle('active', quickEditModeEnabled);
            btn.title = quickEditModeEnabled ? 'إيقاف وضع التعديل' : 'تفعيل وضع التعديل';
            label.textContent = quickEditModeEnabled ? 'إيقاف التعديل' : 'وضع التعديل';
        }

        function setQuickEditState(nextState) {
            quickEditModeEnabled = Boolean(nextState);
            if (!quickEditModeEnabled) {
                highlightedCourseIndex = null;
            }
            updateFloatingEditButton();

            const modal = document.getElementById('modalOverlay');
            if (modal && modal.classList.contains('active') && getCurrentProgram()) {
                editModeEnabled = quickEditModeEnabled;
                renderCurrentProgramModal();
            }
        }

        function toggleFloatingEditMode() {
            if (quickEditModeEnabled) {
                setQuickEditState(false);
                return;
            }
            if (!requestEditAccess()) return;
            setQuickEditState(true);
        }

        function ensureQuickEditEnabled() {
            if (quickEditModeEnabled) return true;
            if (!requestEditAccess()) return false;
            setQuickEditState(true);
            return true;
        }

        function applyProgramMutation() {
            saveCustomData();
            updateStats();
            renderPrograms(activeDegreeFilter);
            const modal = document.getElementById('modalOverlay');
            if (modal.classList.contains('active')) {
                renderCurrentProgramModal();
            }
        }

        window.addEventListener('scroll', () => {
            const statsBar = document.getElementById('statsBar');
            if (window.scrollY > 100) {
                statsBar.classList.add('scrolled');
            } else {
                statsBar.classList.remove('scrolled');
            }
        });

        async function loadData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                sanitizeDataShape(data);
                originalProgramsData = deepClone(data);
                programsData = readStoredData(data);
                sanitizeDataShape(programsData);
                initializeUI();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('programsGrid').innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">⚠️</div>
                        <p>حدث خطأ في تحميل البيانات</p>
                    </div>
                `;
            }
        }

        function updateStats() {
            if (!programsData || !Array.isArray(programsData.programs)) return;
            const totalCourses = programsData.programs.reduce((sum, p) => {
                return sum + ((p.courses && p.courses.length) ? p.courses.length : 0);
            }, 0);
            const uniqueProgramKeys = new Set(
                programsData.programs.map(p => `${normalizeText(p.name)}||${canonicalDegreeLabel(p.degree)}`)
            );
            const uniqueDegrees = new Set(
                programsData.programs.map(p => canonicalDegreeLabel(p.degree))
            );
            document.getElementById('programsCount').textContent = uniqueProgramKeys.size;
            document.getElementById('coursesCount').textContent = totalCourses;
            document.getElementById('degreesCount').textContent = uniqueDegrees.size;
        }

        function initializeUI() {
            if (!programsData || !Array.isArray(programsData.programs)) return;
            updateStats();
            updateFloatingEditButton();

            const degrees = [...new Set(programsData.programs.map(p => canonicalDegreeLabel(p.degree)).filter(Boolean))];
            const tabsContainer = document.getElementById('degreeTabs');
            tabsContainer.innerHTML = `
                <button class="degree-tab ${activeDegreeFilter === 'all' ? 'active' : ''}" data-degree="all">الكل</button>
                ${degrees.map(d => `<button class="degree-tab ${activeDegreeFilter === d ? 'active' : ''}" data-degree="${escapeHtml(d)}">${escapeHtml(d)}</button>`).join('')}
            `;

            tabsContainer.querySelectorAll('.degree-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    renderPrograms(tab.dataset.degree);
                });
            });

            renderPrograms(activeDegreeFilter);
        }

        function renderPrograms(degreeFilter = activeDegreeFilter) {
            if (!programsData || !Array.isArray(programsData.programs)) return;
            activeDegreeFilter = degreeFilter;

            document.querySelectorAll('#degreeTabs .degree-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.degree === activeDegreeFilter);
            });

            const allWithIndex = programsData.programs.map((program, index) => ({ program, index }));
            const filtered = activeDegreeFilter === 'all'
                ? allWithIndex
                : allWithIndex.filter(({ program }) => canonicalDegreeLabel(program.degree) === activeDegreeFilter);

            const grid = document.getElementById('programsGrid');
            if (!filtered.length) {
                grid.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">📚</div>
                        <p>لا توجد برامج في هذا التصنيف</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(({ program, index }) => {
                const planType = normalizeText(program.plan_type) || 'غير محددة';
                const planClass = planType === 'جديدة' ? 'plan-new' : 'plan-old';
                const courseCount = Array.isArray(program.courses) ? program.courses.length : 0;
                return `
                    <div class="program-card" onclick="openProgramModal(${index})">
                        <div class="program-header">
                            <span class="program-degree-badge">${escapeHtml(canonicalDegreeLabel(program.degree))}</span>
                            <div class="program-name">${escapeHtml(program.name)}</div>
                            ${program.name_en ? `<div class="program-name-en">${escapeHtml(program.name_en)}</div>` : ''}
                        </div>
                        <div class="program-body">
                            <div class="program-stats">
                                <div class="program-stat">
                                    <span class="program-stat-value">${escapeHtml(program.total_hours)}</span>
                                    <span class="program-stat-label">ساعة</span>
                                </div>
                                <div class="program-stat">
                                    <span class="program-stat-value">${courseCount}</span>
                                    <span class="program-stat-label">مقرر</span>
                                </div>
                                <div class="program-stat">
                                    <span class="program-stat-value">${escapeHtml(program.version)}</span>
                                    <span class="program-stat-label">إصدار</span>
                                </div>
                            </div>
                            <div class="program-footer">
                                <span class="program-plan-badge ${planClass}">
                                    الخطة ${escapeHtml(planType)}
                                </span>
                                <span class="view-btn">
                                    عرض التفاصيل
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                                    </svg>
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsCount = document.getElementById('resultsCount');
        let searchTimeout;

        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(performSearch, 300);
        });

        function performSearch() {
            if (!programsData || !Array.isArray(programsData.programs)) return;
            const queryRaw = searchInput.value.trim();
            const query = queryRaw.toLowerCase();
            if (query.length < 2) {
                searchResults.classList.remove('active');
                lastSearchResults = [];
                return;
            }

            const grouped = new Map();
            programsData.programs.forEach((program, programIndex) => {
                (program.courses || []).forEach((course, courseIndex) => {
                    const nameAr = normalizeText(course.name).toLowerCase();
                    const code = normalizeText(course.code).toLowerCase();
                    const nameEn = normalizeText(course.name_en).toLowerCase();
                    const isMatch = nameAr.includes(query) || code.includes(query) || (nameEn && nameEn.includes(query));
                    if (!isMatch) return;

                    const key = `${code}||${normalizeText(course.name)}`;
                    if (!grouped.has(key)) {
                        grouped.set(key, {
                            code: course.code,
                            name: course.name,
                            name_en: course.name_en || null,
                            hours: course.hours,
                            type: course.type,
                            occurrences: []
                        });
                    }
                    grouped.get(key).occurrences.push({
                        program: normalizeText(program.name),
                        degree: canonicalDegreeLabel(program.degree),
                        plan_type: normalizeText(program.plan_type),
                        category: course.category || null,
                        programIndex,
                        courseIndex
                    });
                });
            });

            const results = Array.from(grouped.values()).map(item => {
                const programGroups = groupProgramsForCourse(item.occurrences);
                const reqSet = new Set(item.occurrences.map(o => requirementFromCategory(o.category)));
                const catSet = new Set(item.occurrences.map(o => normalizeText(o.category)).filter(Boolean));
                const uniqueRefs = [];
                const seenRefs = new Set();

                item.occurrences.forEach(o => {
                    const key = `${o.programIndex}:${o.courseIndex}`;
                    if (seenRefs.has(key)) return;
                    seenRefs.add(key);
                    uniqueRefs.push({
                        program: o.program,
                        degree: o.degree,
                        plan_type: o.plan_type,
                        category: o.category || null,
                        programIndex: o.programIndex,
                        courseIndex: o.courseIndex
                    });
                });

                return {
                    ...item,
                    program_groups: programGroups,
                    programs_count: programGroups.length,
                    occurrence_refs: uniqueRefs,
                    requirement_summary: reqSet.size === 1 ? Array.from(reqSet)[0] : 'يختلف حسب البرنامج',
                    category_summary: catSet.size === 0 ? null : (catSet.size === 1 ? Array.from(catSet)[0] : 'يختلف حسب البرنامج')
                };
            });

            lastSearchResults = results;
            displayResults(results);
        }

        function displayResults(results) {
            searchResults.classList.add('active');
            resultsCount.textContent = `${results.length} نتيجة`;

            if (!results.length) {
                resultsContainer.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <p>لم يتم العثور على نتائج</p>
                        <p style="font-size:0.85rem;">جرب البحث بكلمات مختلفة</p>
                    </div>
                `;
                return;
            }

            resultsContainer.innerHTML = results.map((result, resultIndex) => {
                const programsHtml = (result.occurrence_refs || []).map((ref, refIndex) => {
                    const chipClass = chipClassForPlans([ref.plan_type]);
                    const planLabel = ref.plan_type ? `الخطة ${ref.plan_type}` : '';
                    return `
                        <button type="button" class="program-chip ${chipClass}" onclick="quickEditOccurrence(${resultIndex}, ${refIndex}, event)">
                            <span class="chip-name">${escapeHtml(ref.program)}</span>
                            <span class="chip-degree">${escapeHtml(ref.degree)}</span>
                            ${planLabel ? `<span class="chip-plans">${escapeHtml(planLabel)}</span>` : ''}
                        </button>
                    `;
                }).join('');

                return `
                    <div class="result-item quick-edit-target" onclick="quickEditFromSearch(${resultIndex})">
                        <div class="result-course-name">${escapeHtml(result.name)}</div>
                        <div class="result-meta">
                            <span class="result-tag"><code class="course-code">${escapeHtml(result.code)}</code></span>
                            <span class="result-tag">${escapeHtml(result.hours)} ساعة</span>
                            <span class="result-tag">${escapeHtml(result.requirement_summary)}</span>
                            ${result.category_summary ? `<span class="result-tag">${escapeHtml(result.category_summary)}</span>` : ''}
                            <span class="result-tag">موجود في ${result.programs_count} برامج</span>
                        </div>
                        <div class="result-programs">${programsHtml}</div>
                    </div>
                `;
            }).join('');
        }

        function clearSearch() {
            searchInput.value = '';
            searchResults.classList.remove('active');
            lastSearchResults = [];
        }

        function quickEditFromSearch(resultIndex) {
            const result = lastSearchResults[resultIndex];
            if (!result || !Array.isArray(result.occurrence_refs) || !result.occurrence_refs.length) {
                return;
            }
            quickEditOccurrence(resultIndex, 0);
        }

        function quickEditOccurrence(resultIndex, referenceIndex, evt) {
            if (evt) evt.stopPropagation();
            const result = lastSearchResults[resultIndex];
            if (!result || !Array.isArray(result.occurrence_refs)) return;
            const target = result.occurrence_refs[referenceIndex];
            if (!target) return;

            if (!ensureQuickEditEnabled()) return;
            openProgramModal(target.programIndex, target.courseIndex);
        }

        function splitCoursesByLocation(program) {
            const coursesByLevel = {};
            const outsideOptionals = [];

            (program.courses || []).forEach((course, courseIndex) => {
                const item = { course, courseIndex };
                if (isOutsideLevelElective(course)) {
                    outsideOptionals.push(item);
                    return;
                }
                const level = Math.max(1, Math.round(toNumber(course.level, 1)));
                if (!coursesByLevel[level]) {
                    coursesByLevel[level] = [];
                }
                coursesByLevel[level].push(item);
            });

            const levelNumbers = Object.keys(coursesByLevel).map(Number).sort((a, b) => a - b);
            return { coursesByLevel, outsideOptionals, levelNumbers };
        }

        function sumCourseHours(items) {
            return (items || []).reduce((sum, item) => sum + toNumber(item.course && item.course.hours, 0), 0);
        }

        function renderCourseRow(item) {
            const course = item.course || {};
            const courseIndex = item.courseIndex;
            const inOutsidePool = isOutsideLevelElective(course);
            const levelValue = Math.max(1, Math.round(toNumber(course.level, 1)));
            const typeValue = normalizeText(course.type) || 'نظري';
            const rowClass = highlightedCourseIndex === courseIndex ? 'course-row-highlight' : '';

            if (!editModeEnabled) {
                return `
                    <tr class="${rowClass}" data-course-index="${courseIndex}">
                        <td><code class="course-code">${escapeHtml(course.code)}</code></td>
                        <td>
                            <strong>${escapeHtml(course.name)}</strong>
                            ${course.name_en ? `<br><small style="color:var(--text-muted)">${escapeHtml(course.name_en)}</small>` : ''}
                            ${course.category ? `<span class="course-meta">${escapeHtml(course.category)}</span>` : ''}
                        </td>
                        <td>${escapeHtml(course.hours)}</td>
                        <td><span class="course-type-badge ${getCourseTypeClass(typeValue)}">${escapeHtml(typeValue)}</span></td>
                    </tr>
                `;
            }

            return `
                <tr class="${rowClass}" data-course-index="${courseIndex}">
                    <td>
                        <input class="edit-input" value="${escapeHtml(course.code)}" placeholder="رمز المقرر" onchange="setCourseField(${courseIndex}, 'code', this.value)">
                    </td>
                    <td>
                        <input class="edit-input" value="${escapeHtml(course.name)}" placeholder="اسم المقرر" onchange="setCourseField(${courseIndex}, 'name', this.value)">
                        <input class="edit-input" value="${escapeHtml(course.name_en || '')}" placeholder="الاسم بالإنجليزية" onchange="setCourseField(${courseIndex}, 'name_en', this.value)">
                        <input class="edit-input" value="${escapeHtml(course.category || '')}" placeholder="التصنيف" onchange="setCourseField(${courseIndex}, 'category', this.value)">
                    </td>
                    <td>
                        <input type="number" min="0" step="1" class="edit-input" value="${toNumber(course.hours, 0)}" onchange="setCourseField(${courseIndex}, 'hours', this.value)">
                    </td>
                    <td>
                        <input class="edit-input" value="${escapeHtml(typeValue)}" placeholder="نوع المقرر" onchange="setCourseField(${courseIndex}, 'type', this.value)">
                    </td>
                    <td>
                        <div class="row-actions">
                            <div class="action-inline">
                                <span>المستوى</span>
                                <select class="edit-select" onchange="moveCourseLevel(${courseIndex}, this.value)">
                                    ${levelOptionsHtml(levelValue)}
                                </select>
                            </div>
                            <label class="action-inline">
                                <input type="checkbox" ${inOutsidePool ? 'checked' : ''} onchange="setCourseOutsidePool(${courseIndex}, this.checked)">
                                خارج المستويات
                            </label>
                            <button type="button" class="mini-btn" onclick="removeCourse(${courseIndex})">حذف</button>
                        </div>
                    </td>
                </tr>
            `;
        }

        function renderCoursesTable(items, emptyLabel) {
            const colCount = editModeEnabled ? 5 : 4;
            return `
                <table class="courses-table">
                    <thead>
                        <tr>
                            <th>رمز المقرر</th>
                            <th>اسم المقرر</th>
                            <th>الساعات</th>
                            <th>النوع</th>
                            ${editModeEnabled ? '<th>إجراءات</th>' : ''}
                        </tr>
                    </thead>
                    <tbody>
                        ${items.length
                            ? items.map(renderCourseRow).join('')
                            : `<tr><td colspan="${colCount}" style="text-align:center;color:var(--text-muted);">${escapeHtml(emptyLabel)}</td></tr>`
                        }
                    </tbody>
                </table>
            `;
        }

        function renderCurrentProgramModal() {
            const program = getCurrentProgram();
            if (!program) return;

            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            modalTitle.textContent = `${normalizeText(program.name)} - ${canonicalDegreeLabel(program.degree)}`;

            const { coursesByLevel, outsideOptionals, levelNumbers } = splitCoursesByLocation(program);
            const levelItems = levelNumbers.flatMap(level => coursesByLevel[level] || []);
            const countedHours = sumCourseHours(levelItems);
            const outsideHours = sumCourseHours(outsideOptionals);
            const planHours = toNumber(program.total_hours, 0);

            let html = `
                <div class="download-actions">
                    <button class="download-btn pdf" onclick="printPlanOnly()">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5zM9 9.5h1v-1H9v1zM4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm10 5.5h1v-3h-1v3z"/>
                        </svg>
                        طباعة / حفظ PDF
                    </button>
                    <button class="download-btn" style="background:#0EA5E9;color:#fff;" onclick="downloadCSV()">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm1 7V3.5L19.5 9H15zM8 13h8v2H8v-2zm0 4h8v2H8v-2z"/>
                        </svg>
                        تنزيل CSV
                    </button>
                    <button class="download-btn edit-toggle ${editModeEnabled ? 'edit-on' : ''}" onclick="toggleEditMode()">
                        ${editModeEnabled ? 'إيقاف التعديل' : 'زر التعديل'}
                    </button>
                    ${editModeEnabled ? `
                        <button class="download-btn add-course" onclick="addCourseToProgram(false)">إضافة مقرر داخل مستوى</button>
                        <button class="download-btn add-course" onclick="addCourseToProgram(true)">إضافة اختياري خارج المستويات</button>
                        <button class="download-btn save-edit" onclick="saveEditsNow()">حفظ التعديلات</button>
                    ` : ''}
                </div>
            `;

            if (editModeEnabled) {
                html += `
                    <div class="edit-help">
                        وضع التعديل مفعّل: يمكنك تعديل اسم/رمز/ساعات المقرر، ونقله بين المستويات، أو تحويله إلى "اختياري خارج المستويات" غير محسوب في الساعات.
                    </div>
                `;
            }

            html += `
                <div class="modal-info">
                    <span class="modal-info-badge ${program.plan_type === 'جديدة' ? 'plan-new' : 'plan-old'}">
                        الخطة ${escapeHtml(program.plan_type)} (إصدار ${escapeHtml(program.version)})
                    </span>
                    <span class="modal-info-badge" style="background:var(--bg-light);">
                        إجمالي الساعات بالخطة: <strong>${escapeHtml(program.total_hours)}</strong>
                    </span>
                    <span class="modal-info-badge hours-compare-badge">
                        الساعات المحتسبة فعليًا: <strong>${countedHours}</strong>
                    </span>
                    <span class="modal-info-badge" style="background:#FEF3C7;color:#92400E;">
                        اختياري خارج المستويات: <strong>${outsideOptionals.length}</strong> مقرر (${outsideHours} ساعة غير محتسبة)
                    </span>
                </div>
            `;

            if (planHours && countedHours !== planHours) {
                html += `
                    <div class="optional-pool-note">
                        ملاحظة: ساعات المقررات الاختيارية خارج المستويات لا تدخل في حساب "الساعات المحتسبة فعليًا".
                    </div>
                `;
            }

            if (!levelNumbers.length) {
                html += `
                    <div class="no-results" style="padding:1.5rem 1rem;">
                        <p>لا توجد مقررات ضمن المستويات حاليًا.</p>
                    </div>
                `;
            }

            levelNumbers.forEach(level => {
                const items = coursesByLevel[level] || [];
                const levelHours = sumCourseHours(items);
                html += `
                    <div class="courses-by-level">
                        <div class="level-header">
                            <span class="level-number">${level}</span>
                            <span class="level-title">${getLevelTitle(level)}</span>
                            <span class="level-hours">${levelHours} ساعة محتسبة</span>
                        </div>
                        ${renderCoursesTable(items, 'لا توجد مقررات في هذا المستوى')}
                    </div>
                `;
            });

            html += `
                <div class="courses-by-level optional-pool-section">
                    <div class="level-header">
                        <span class="level-number">م</span>
                        <span class="level-title">مقررات اختيارية خارج المستويات</span>
                        <span class="level-hours">غير محسوبة ضمن ساعات الخطة</span>
                    </div>
                    <div class="optional-pool-note" style="margin-top:0;margin-bottom:0.75rem;">
                        هذه المقررات تمثل بنك اختيارات، يختار الطالب منها حسب متطلبات الخطة، ولا يُفترض دراسة جميعها.
                    </div>
                    ${renderCoursesTable(outsideOptionals, 'لا توجد مقررات اختيارية خارج المستويات حتى الآن')}
                </div>
            `;

            modalBody.innerHTML = html;
            if (highlightedCourseIndex !== null) {
                requestAnimationFrame(() => {
                    const targetRow = modalBody.querySelector(`[data-course-index="${highlightedCourseIndex}"]`);
                    if (targetRow) {
                        targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                });
            }
        }

        function openProgramModal(programIndex, focusCourseIndex = null) {
            const program = programsData && programsData.programs ? programsData.programs[programIndex] : null;
            if (!program) return;

            currentProgramIndex = programIndex;
            currentProgram = program;
            highlightedCourseIndex = Number.isInteger(focusCourseIndex) ? focusCourseIndex : null;
            editModeEnabled = quickEditModeEnabled;
            renderCurrentProgramModal();

            const modal = document.getElementById('modalOverlay');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function toggleEditMode() {
            const program = getCurrentProgram();
            if (!program) return;
            if (!quickEditModeEnabled) {
                if (!requestEditAccess()) return;
                setQuickEditState(true);
                return;
            }
            setQuickEditState(false);
        }

        function setCourseField(courseIndex, field, value) {
            const program = getCurrentProgram();
            if (!program || !program.courses || !program.courses[courseIndex]) return;

            const course = program.courses[courseIndex];
            if (field === 'hours') {
                course.hours = Math.max(0, Math.round(toNumber(value, 0)));
            } else if (field === 'level') {
                course.level = Math.max(1, Math.round(toNumber(value, 1)));
            } else {
                course[field] = value;
            }

            if (!normalizeText(course.type)) {
                course.type = 'نظري';
            }
            if (!toNumber(course.level, 0)) {
                course.level = 1;
            }

            applyProgramMutation();
        }

        function moveCourseLevel(courseIndex, levelValue) {
            const program = getCurrentProgram();
            if (!program || !program.courses || !program.courses[courseIndex]) return;

            const course = program.courses[courseIndex];
            course.level = Math.max(1, Math.round(toNumber(levelValue, 1)));
            course.optional_pool = false;
            applyProgramMutation();
        }

        function setCourseOutsidePool(courseIndex, isOutside) {
            const program = getCurrentProgram();
            if (!program || !program.courses || !program.courses[courseIndex]) return;

            const course = program.courses[courseIndex];
            course.optional_pool = Boolean(isOutside);
            if (!course.level || toNumber(course.level, 0) < 1) {
                course.level = 1;
            }
            applyProgramMutation();
        }

        function addCourseToProgram(asOutsidePool) {
            const program = getCurrentProgram();
            if (!program) return;

            const serial = (program.courses ? program.courses.length : 0) + 1;
            const newCourse = {
                code: `NEW-${serial}`,
                name: asOutsidePool ? 'مقرر اختياري جديد' : 'مقرر جديد',
                name_en: '',
                hours: 2,
                level: 1,
                type: 'نظري',
                category: asOutsidePool ? 'اختيارية القسم' : 'إجبارية القسم'
            };

            if (asOutsidePool) {
                newCourse.optional_pool = true;
            }

            if (!Array.isArray(program.courses)) {
                program.courses = [];
            }
            program.courses.push(newCourse);
            applyProgramMutation();
        }

        function removeCourse(courseIndex) {
            const program = getCurrentProgram();
            if (!program || !program.courses || !program.courses[courseIndex]) return;

            const course = program.courses[courseIndex];
            const ok = confirm(`هل تريد حذف المقرر: ${normalizeText(course.name) || normalizeText(course.code)} ؟`);
            if (!ok) return;

            program.courses.splice(courseIndex, 1);
            applyProgramMutation();
        }

        function saveEditsNow() {
            saveCustomData();
            alert('تم حفظ التعديلات محليًا على هذا الجهاز.');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
            currentProgram = null;
            currentProgramIndex = null;
            highlightedCourseIndex = null;
            editModeEnabled = false;
        }

        document.getElementById('modalOverlay').addEventListener('click', e => {
            if (e.target.id === 'modalOverlay') {
                closeModal();
            }
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        function printPlanOnly() {
            if (!getCurrentProgram()) {
                alert('لم يتم تحديد برنامج');
                return;
            }
            document.body.classList.add('print-plan');
            setTimeout(() => {
                window.print();
            }, 50);
        }

        window.addEventListener('afterprint', () => {
            document.body.classList.remove('print-plan');
        });

        function downloadCSV() {
            const program = getCurrentProgram();
            if (!program) {
                alert('لم يتم تحديد برنامج');
                return;
            }

            const safePlan = program.plan_type === 'جديدة' ? 'new' : (program.plan_type === 'قديمة' ? 'old' : 'plan');
            const safeName = (program.name_en || program.name).toString()
                .replace(/[^a-zA-Z0-9]+/g, '_')
                .replace(/^_+|_+$/g, '') || 'plan';
            const fileName = `${safeName}_${safePlan}.csv`;

            const rows = [
                ['Program', (program.name_en || program.name)],
                ['Degree', canonicalDegreeLabel(program.degree)],
                ['Plan', program.plan_type],
                ['Version', program.version],
                ['Total Hours', program.total_hours],
                [],
                ['Level', 'Code', 'Course Name', 'English Name', 'Hours', 'Type', 'Category', 'Optional Pool', 'Counted In Hours']
            ];

            (program.courses || []).forEach(course => {
                const outside = isOutsideLevelElective(course);
                rows.push([
                    outside ? 'Outside Elective Pool' : Math.max(1, Math.round(toNumber(course.level, 1))),
                    course.code ?? '',
                    course.name ?? '',
                    course.name_en ?? '',
                    course.hours ?? '',
                    course.type ?? '',
                    course.category ?? '',
                    outside ? 'Yes' : 'No',
                    outside ? 'No' : 'Yes'
                ]);
            });

            const csv = rows.map(r => r.map(v => {
                const s = (v === null || v === undefined) ? '' : String(v);
                return `"${s.replace(/"/g, '""')}"`;
            }).join(',')).join('\n');

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                URL.revokeObjectURL(url);
                a.remove();
            }, 1000);
        }

        function downloadAllCSV() {
            if (!programsData || !programsData.programs || !programsData.programs.length) {
                alert('لا توجد بيانات لتحميلها');
                return;
            }

            const rows = [[
                'Program',
                'Program EN',
                'Degree',
                'Plan',
                'Version',
                'Total Hours',
                'Level',
                'Code',
                'Course Name',
                'English Name',
                'Hours',
                'Type',
                'Category',
                'Optional Pool',
                'Counted In Hours'
            ]];

            programsData.programs.forEach(program => {
                const programName = (program.name_en || program.name || '');
                const degree = canonicalDegreeLabel(program.degree);
                const planType = program.plan_type || '';
                const version = program.version || '';
                const totalHours = program.total_hours || '';
                const courses = (program.courses || []);

                if (!courses.length) {
                    rows.push([programName, (program.name_en || ''), degree, planType, version, totalHours, '', '', '', '', '', '', '', '', '']);
                    return;
                }

                courses.forEach(course => {
                    const outside = isOutsideLevelElective(course);
                    rows.push([
                        programName,
                        (program.name_en || ''),
                        degree,
                        planType,
                        version,
                        totalHours,
                        outside ? 'Outside Elective Pool' : (course.level ?? ''),
                        (course.code ?? ''),
                        (course.name ?? ''),
                        (course.name_en ?? ''),
                        (course.hours ?? ''),
                        (course.type ?? ''),
                        (course.category ?? ''),
                        outside ? 'Yes' : 'No',
                        outside ? 'No' : 'Yes'
                    ]);
                });
            });

            const csv = rows.map(r => r.map(v => {
                const s = (v === null || v === undefined) ? '' : String(v);
                return `"${s.replace(/"/g, '""')}"`;
            }).join(',')).join('\n');

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'all_plans.csv';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                URL.revokeObjectURL(url);
                a.remove();
            }, 1000);
        }

        function downloadEditedJSON() {
            if (!programsData) {
                alert('لا توجد بيانات متاحة');
                return;
            }
            const blob = new Blob([JSON.stringify(programsData, null, 2)], {
                type: 'application/json;charset=utf-8;'
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'data-edited.json';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                URL.revokeObjectURL(url);
                a.remove();
            }, 1000);
        }

        function resetToOriginalData() {
            if (!originalProgramsData) {
                alert('البيانات الأصلية غير متوفرة');
                return;
            }
            const ok = confirm('سيتم حذف جميع التعديلات المحلية والعودة للبيانات الأصلية. هل تريد المتابعة؟');
            if (!ok) return;

            programsData = deepClone(originalProgramsData);
            sanitizeDataShape(programsData);
            clearCustomData();
            closeModal();
            clearSearch();
            activeDegreeFilter = 'all';
            initializeUI();
            alert('تمت استعادة البيانات الأصلية بنجاح.');
        }

        loadData();
    </script>
</body>
</html>
