<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطط ومقررات كلية الشريعة والأنظمة | جامعة الطائف</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- SheetJS for Excel generation -->
<!-- jsPDF for PDF generation -->
<style>
        :root {
            --primary: #1B5E3B;
            --primary-light: #2E8B57;
            --primary-dark: #0D3D1F;
            --primary-gradient: linear-gradient(135deg, #0D3D1F 0%, #1B5E3B 50%, #2E8B57 100%);
            --accent: #D4AF37;
            --accent-light: #F4D03F;
            --accent-dark: #9A7B0A;
            --bg-cream: #FEFCF6;
            --bg-light: #F8F5ED;
            --bg-card: #FFFFFF;
            --text-dark: #1A1A1A;
            --text-medium: #4A4A4A;
            --text-muted: #6B6B6B;
            --border-light: #E8E4D9;
            --border-medium: #D5CFC0;
            --shadow-sm: 0 2px 8px rgba(27, 94, 59, 0.08);
            --shadow-md: 0 4px 16px rgba(27, 94, 59, 0.12);
            --shadow-lg: 0 8px 32px rgba(27, 94, 59, 0.16);
            --shadow-xl: 0 16px 48px rgba(27, 94, 59, 0.20);
            --radius-xs: 6px;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Kufi Arabic', sans-serif;
            background: var(--bg-cream);
            color: var(--text-dark);
            line-height: 1.8;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Geometric Pattern Background */
        .geometric-pattern {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            opacity: 0.025;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%231B5E3B' stroke-width='1'%3E%3Cpath d='M40 0L80 40L40 80L0 40Z'/%3E%3Cpath d='M40 10L70 40L40 70L10 40Z'/%3E%3Cpath d='M40 20L60 40L40 60L20 40Z'/%3E%3C/g%3E%3C/svg%3E");
        }

        /* Header Section */
        header {
            background: var(--primary-gradient);
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0L60 30L30 60L0 30Z' fill='%23ffffff' fill-opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-dark), var(--accent), var(--accent-light), var(--accent), var(--accent-dark));
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 3rem;
            position: relative;
            z-index: 1;
        }

        .university-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            padding: 0.6rem 1.25rem;
            border-radius: 50px;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(255,255,255,0.18);
            font-size: 0.9rem;
            font-weight: 500;
            animation: fadeInDown 0.6s ease-out;
        }

        .university-badge svg {
            width: 28px;
            height: 28px;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Amiri', serif;
            font-size: clamp(1.75rem, 4.5vw, 3rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }

        .subtitle {
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            opacity: 0.92;
            font-weight: 400;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Stats Bar */
        .stats-bar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            padding: 0.75rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
            transition: box-shadow var(--transition-smooth);
        }

        .stats-bar.scrolled {
            box-shadow: var(--shadow-md);
        }

        .stats-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            padding: 0.5rem 1rem;
            position: relative;
        }

        .stat-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 30px;
            width: 1px;
            background: var(--border-light);
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            display: block;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Main Content */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
            position: relative;
            z-index: 1;
        }

        /* Search Section */
        .search-section {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-light);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-title {
            font-family: 'Amiri', serif;
            font-size: 1.35rem;
            color: var(--primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .search-title svg {
            width: 24px;
            height: 24px;
        }

        .search-box {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.25rem;
            padding-right: 3.5rem;
            font-size: 1rem;
            font-family: 'Noto Kufi Arabic', sans-serif;
            border: 2px solid var(--border-medium);
            border-radius: var(--radius-md);
            transition: all var(--transition-smooth);
            background: var(--bg-light);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-card);
            box-shadow: 0 0 0 4px rgba(27, 94, 59, 0.1);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color var(--transition-fast);
        }

        .search-input:focus + .search-icon {
            color: var(--primary);
        }

        /* Search Results */
        .search-results {
            margin-top: 1.5rem;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .search-results.active {
            display: block;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-light);
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .results-count {
            font-weight: 600;
            color: var(--primary);
            font-size: 0.95rem;
        }

        .clear-search {
            padding: 0.5rem 1rem;
            background: var(--bg-light);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--text-medium);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .clear-search:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .result-item {
            background: var(--bg-light);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-bottom: 0.6rem;
            transition: all var(--transition-smooth);
        }

        .result-item:hover {
            border-color: var(--primary);
            transform: translateX(-4px);
            box-shadow: 4px 0 0 var(--accent);
        }

        .result-item.course-details-target {
            cursor: pointer;
            outline: none;
        }

        .result-item.course-details-target:focus-visible {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 77, 46, 0.18);
        }

        .result-course-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.4rem;
        }

        .result-course-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--primary-dark);
        }

        .result-course-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .course-pdf-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            flex-shrink: 0;
            padding: 0.55rem 0.8rem;
            border-radius: var(--radius-sm);
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            border: 1px solid var(--primary-dark);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .course-pdf-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .course-pdf-btn:focus-visible,
        .download-btn.pdf:focus-visible {
            outline: 3px solid var(--primary-dark);
            outline-offset: 3px;
        }

        .course-pdf-btn.warning {
            background: #B45309;
            border-color: #92400E;
        }

        .course-pdf-btn.warning:hover {
            background: #92400E;
        }

        .course-pdf-btn svg {
            width: 17px;
            height: 17px;
        }

        .course-warning-chip,
        .equivalency-status-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            border-radius: 999px;
            padding: 0.25rem 0.65rem;
            font-size: 0.72rem;
            font-weight: 700;
            border: 1px solid transparent;
        }

        .course-warning-chip {
            color: #92400E;
            background: #FFFBEB;
            border-color: #FCD34D;
        }

        .equivalency-status-chip.has-equivalency {
            color: #065F46;
            background: #ECFDF5;
            border-color: #A7F3D0;
        }

        .result-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.55rem;
        }

        .equivalent-context-list {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .equivalent-context-line {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.35rem;
            font-size: 0.73rem;
            color: #065F46;
        }

        .equivalent-context-label {
            font-weight: 700;
            color: #0F766E;
        }

        .equivalent-context-options {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .equivalent-or {
            font-size: 0.68rem;
            color: #0F766E;
            font-weight: 700;
        }

        .equivalent-chip {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            font-size: 0.72rem;
            border: 1px solid #A7F3D0;
            color: #065F46;
            background: #ECFDF5;
            line-height: 1.25;
        }

        .result-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            background: var(--bg-card);
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid var(--border-light);
        }

        .course-code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-weight: 600;
            color: var(--primary);
            direction: ltr;
            unicode-bidi: isolate;
            display: inline-block;
        }

        .result-programs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }

        .result-more-programs {
            display: inline-flex;
            align-items: center;
            padding: 0.3rem 0.55rem;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            font-size: 0.7rem;
            font-weight: 700;
        }

        .program-chip {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.35rem;
            padding: 0.35rem 0.65rem;
            border-radius: var(--radius-sm);
            font-size: 0.72rem;
            border: 1px solid var(--border-light);
            background: var(--bg-card);
            color: var(--text-dark);
            line-height: 1.3;
            font-family: inherit;
            appearance: none;
            cursor: pointer;
            text-align: right;
            text-decoration: none;
        }

        .program-chip:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .program-chip .chip-degree {
            font-weight: 600;
        }

        .program-chip .chip-plans {
            font-size: 0.68rem;
            opacity: 0.85;
        }

        .program-chip.plan-new {
            background: rgba(27, 94, 59, 0.08);
            border-color: rgba(27, 94, 59, 0.2);
            color: var(--primary);
        }

        .program-chip.plan-old {
            background: rgba(212, 175, 55, 0.12);
            border-color: rgba(212, 175, 55, 0.3);
            color: var(--accent-dark);
        }

        .program-chip.plan-mixed {
            background: linear-gradient(135deg, rgba(27, 94, 59, 0.08), rgba(212, 175, 55, 0.12));
            border-color: rgba(27, 94, 59, 0.2);
        }

        .no-results {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .no-results-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Programs Section */
        .programs-section {
            margin-top: 2rem;
            animation: slideUp 0.5s ease-out 0.2s both;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-family: 'Amiri', serif;
            font-size: clamp(1.35rem, 3vw, 1.65rem);
            color: var(--primary-dark);
            white-space: nowrap;
        }

        .section-line {
            flex: 1;
            height: 2px;
            background: linear-gradient(to left, transparent, var(--accent), transparent);
        }

        /* Degree Tabs */
        .degree-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            padding: 0.5rem;
            background: var(--bg-light);
            border-radius: var(--radius-lg);
        }

        .degree-tab {
            padding: 0.65rem 1.25rem;
            border: none;
            border-radius: var(--radius-md);
            background: transparent;
            color: var(--text-medium);
            font-family: 'Noto Kufi Arabic', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-smooth);
            flex: 1;
            min-width: fit-content;
            text-align: center;
        }

        .degree-tab:hover {
            background: var(--bg-card);
            color: var(--primary);
        }

        .degree-tab.active {
            background: var(--primary);
            color: #fff;
            box-shadow: var(--shadow-sm);
        }

        /* Program Cards Grid */
        .programs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.25rem;
        }

        .program-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            transition: all var(--transition-smooth);
            cursor: pointer;
        }

        .program-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
        }

        .program-header {
            background: var(--primary-gradient);
            color: #fff;
            padding: 1.25rem;
            position: relative;
            overflow: hidden;
        }

        .program-header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .program-degree-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 0.3rem 0.85rem;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .program-name {
            font-family: 'Amiri', serif;
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .program-name-en {
            font-size: 0.8rem;
            opacity: 0.85;
            font-weight: 400;
            margin-top: 0.25rem;
        }

        .program-body {
            padding: 1.25rem;
        }

        .program-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .program-stat {
            text-align: center;
            padding: 0.6rem;
            background: var(--bg-light);
            border-radius: var(--radius-sm);
        }

        .program-stat-value {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary);
        }

        .program-stat-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .program-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .program-plan-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.85rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .plan-new {
            background: rgba(27, 94, 59, 0.1);
            color: var(--primary);
        }

        .plan-old {
            background: rgba(212, 175, 55, 0.15);
            color: var(--accent-dark);
        }

        .view-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.85rem;
            background: var(--bg-light);
            border: 1px solid var(--border-medium);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-medium);
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
        }

        .view-btn:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all var(--transition-smooth);
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow: hidden;
            transform: scale(0.95) translateY(20px);
            transition: transform var(--transition-bounce);
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            background: var(--primary-gradient);
            color: #fff;
            padding: 1.25rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .modal-title {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .modal-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .modal-close:hover {

    <script>
        const EDIT_PASSWORD = '140505';
        const LOCAL_STORAGE_KEY = 'courseOfShar3ah_custom_data_v3';
        const LEGACY_LOCAL_STORAGE_KEYS = ['courseOfShar3ah_custom_data_v2'];
        const MAX_LEVEL = 12;

        let programsData = null;
        let originalProgramsData = null;
        let currentProgram = null;
        let currentProgramIndex = null;
        let activeDegreeFilter = 'all';
        let editAccessGranted = false;
        let editModeEnabled = false;
        let quickEditModeEnabled = false;
        let highlightedCourseIndex = null;
        let lastSearchResults = [];
        let courseCatalogByCode = new Map();
        let equivalencyRulesBySource = new Map();
        let equivalencyUiState = new Map();
        let lastCourseDetailsTrigger = null;

        function deepClone(value) {
            return JSON.parse(JSON.stringify(value));
        }

        function normalizeText(s) {
            return (s || '').toString().trim().replace(/\s+/g, ' ');
        }

        function normalizePasswordInput(value) {
            const westernDigits = '0123456789';
            const arabicIndicDigits = '٠١٢٣٤٥٦٧٨٩';
            const easternArabicDigits = '۰۱۲۳۴۵۶۷۸۹';

            return normalizeText(value)
                .split('')
                .map(char => {
                    const arabicIndex = arabicIndicDigits.indexOf(char);
                    if (arabicIndex !== -1) return westernDigits[arabicIndex];

                    const easternIndex = easternArabicDigits.indexOf(char);
                    if (easternIndex !== -1) return westernDigits[easternIndex];

                    return char;
                })
                .join('')
                .replace(/\s+/g, '');
        }

        function escapeHtml(value) {
            return (value === null || value === undefined ? '' : String(value))
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function toNumber(value, fallback = 0) {
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : fallback;
        }

        function normalizeCourseCode(code) {
            return normalizeText(code).replace(/\s+/g, '').toUpperCase();
        }

        function normalizeCourseIdentityName(value) {
            const withoutBidiControls = normalizeText(value)
                .normalize('NFC')
                .replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069]/g, '');
            return normalizeText(withoutBidiControls);
        }

        function getCourseIdentityKey(codeRaw, nameRaw) {
            return `${normalizeCourseCode(codeRaw)}||${normalizeCourseIdentityName(nameRaw)}`;
        }

        function getCourseDetailVariants(codeRaw, courseNameRaw = '') {
            const codeKey = normalizeCourseCode(codeRaw);
            if (!codeKey || !programsData || !programsData.course_details) return [];
            const entry = programsData.course_details[codeKey];
            if (!entry || typeof entry !== 'object' || Array.isArray(entry)) return [];
            const variants = Array.isArray(entry.variants)
                ? entry.variants.filter(variant => variant && typeof variant === 'object' && !Array.isArray(variant))
                : [entry];
            const courseName = normalizeCourseIdentityName(courseNameRaw);
            if (!courseName) return variants;

            const exactMatches = variants.filter(details =>
                normalizeCourseIdentityName(details.title) === courseName
            );
            if (exactMatches.length) return exactMatches;

            // A supplied course name is part of the course identity. Never fall
            // back from code+name to code-only: the same code can legitimately
            // have a separate catalog-only specification under another title.
            return [];
        }

        function getCourseDetailScopes(details) {
            if (!details || typeof details !== 'object') return [];
            if (Array.isArray(details.scopes)) {
                return details.scopes.filter(scope => scope && typeof scope === 'object' && !Array.isArray(scope));
            }
            const scope = details.scope;
            return scope && typeof scope === 'object' && !Array.isArray(scope) ? [scope] : [];
        }

        function getCourseDetailScope(details) {
            return getCourseDetailScopes(details)[0] || {};
        }

        function isCourseDetailScopePopulated(scope) {
            return Boolean(
                normalizeText(scope && scope.program) ||
                normalizeText(scope && scope.degree) ||
                normalizeText(scope && scope.plan_type) ||
                normalizeText(scope && scope.version)
            );
        }

        function courseDetailHasScope(details) {
            return getCourseDetailScopes(details).some(isCourseDetailScopePopulated);
        }

        function courseDetailMatchesContext(details, context = {}) {
            if (!courseDetailHasScope(details)) return true;
            return getCourseDetailScopes(details).some(scope => ruleMatchesContext(scope, context));
        }

        function getCourseDetails(codeRaw, context = null, courseNameRaw = '') {
            const variants = getCourseDetailVariants(codeRaw, courseNameRaw);
            if (!variants.length) return null;

            if (context) {
                const scopedMatch = variants.find(details => courseDetailHasScope(details) && courseDetailMatchesContext(details, context));
                if (scopedMatch) return scopedMatch;
            }

            return variants.find(details => !courseDetailHasScope(details)) || null;
        }

        function getCourseDetailContextsForSearch(codeRaw, references, courseNameRaw = '') {
            const contexts = [];
            const seen = new Set();

            getCourseDetailVariants(codeRaw, courseNameRaw).forEach(details => {
                const scoped = courseDetailHasScope(details);
                const matchedScopes = scoped
                    ? getCourseDetailScopes(details).filter(scope => (references || []).some(ref => ruleMatchesContext(scope, ref)))
                    : [];
                if (scoped && !matchedScopes.length) return;

                const normalizedScopes = matchedScopes.map(scope => normalizeContext(scope));
                const signature = `${sanitizeResourceUrl(details.pdf_url)}||${JSON.stringify(normalizedScopes)}`;
                if (seen.has(signature)) return;
                seen.add(signature);

                let downloadLabel = 'التوصيف';
                const matchedPrograms = Array.from(new Set(
                    matchedScopes.map(scope => normalizeText(scope.program)).filter(Boolean)
                ));
                const programLabel = matchedPrograms.length === 1 ? matchedPrograms[0] : '';
                if (matchedScopes.length === 1) {
                    const planType = normalizeText(matchedScopes[0].plan_type);
                    const planTypeLabel = planType && !planType.startsWith('ال') ? `ال${planType}` : planType;
                    const version = normalizeText(matchedScopes[0].version);
                    downloadLabel = `توصيف${programLabel ? ` ${programLabel}` : ''}${version ? ` (${version})` : (planTypeLabel ? ` — ${planTypeLabel}` : '')}`.replace(/\s+/g, ' ').trim();
                } else if (matchedScopes.length > 1) {
                    const versions = Array.from(new Set(matchedScopes.map(scope => normalizeText(scope.version)).filter(Boolean)));
                    downloadLabel = versions.length
                        ? `توصيف${programLabel ? ` ${programLabel}` : ''} (${versions.join('، ')})`
                        : `التوصيف${programLabel ? ` — ${programLabel}` : ''}`;
                }

                contexts.push({
                    details,
                    context_label: matchedScopes.map(scope => buildEquivalencyContextLabel(scope)).join('؛ '),
                    download_label: downloadLabel
                });
            });

            return contexts;
        }

        function sanitizeResourceUrl(value) {
            const url = normalizeText(value);
            if (!url) return '';
            if (/^https?:\/\//i.test(url) || /^(?:\.\/)?assets\//i.test(url)) return url;
            return '';
        }

        function getSpecificationPublicWarning(details) {
            const status = normalizeText(details && details.match_status);
            if (status === 'verified_with_hours_warning') {
                return 'اختلاف في عدد الساعات بين الخطة والتوصيف';
            }
            if (['code_match_name_diff', 'code_mismatch', 'name_only'].includes(status)) {
                return 'تختلف بعض بيانات التوصيف عن بيانات المقرر';
            }
            return '';
        }

        function renderCoursePdfButton(details, label = 'تحميل التوصيف', accessibleLabel = label) {
            const url = sanitizeResourceUrl(details && details.pdf_url);
            if (!url) return '';

            const publicWarning = getSpecificationPublicWarning(details);
            const warningClass = publicWarning ? ' warning' : '';
            const ariaLabel = normalizeText(accessibleLabel).startsWith('تحميل')
                ? normalizeText(accessibleLabel)
                : `تحميل ${normalizeText(accessibleLabel)}`;
            return `
                <a class="course-pdf-btn${warningClass}" href="${escapeHtml(url)}" download onclick="event.stopPropagation()" title="تحميل توصيف المقرر بصيغة PDF" aria-label="${escapeHtml(ariaLabel)} بصيغة PDF">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm1 7V3.5L19.5 9H15zM12 12v4.17l1.59-1.58L15 16l-4 4-4-4 1.41-1.41L10 16.17V12h2z"/>
                    </svg>
                    ${escapeHtml(label)}
                </a>
            `;
        }

        function renderSpecificationWarningChip(details) {
            const warning = getSpecificationPublicWarning(details);
            return warning ? `<span class="course-warning-chip">${escapeHtml(warning)}</span>` : '';
        }

        function looksLikeCourseCode(value) {
            const text = normalizeText(value);
            if (!text) return false;
            return /\d/.test(text) && !/\s/.test(text) && text.length <= 30;
        }

        function parseEquivalentItem(rawValue) {
            if (rawValue === null || rawValue === undefined) return null;

            if (typeof rawValue === 'object' && !Array.isArray(rawValue)) {
                const codeRaw = normalizeText(rawValue.code || rawValue.course_code || rawValue.id || '');
                const nameRaw = normalizeText(rawValue.name || rawValue.name_ar || rawValue.label || rawValue.title || '');
                if (codeRaw) {
                    return {
                        code: codeRaw,
                        codeKey: normalizeCourseCode(codeRaw),
                        name: nameRaw,
                        label: nameRaw ? `${codeRaw} - ${nameRaw}` : codeRaw
                    };
                }
                if (nameRaw) {
                    return {
                        code: '',
                        codeKey: '',
                        name: '',
                        label: nameRaw
                    };
                }
                return null;
            }

            const text = normalizeText(rawValue);
            if (!text) return null;

            const codeWithName = text.match(/^([^\s,;]+)\s*[-–—:]\s*(.+)$/);
            if (codeWithName && looksLikeCourseCode(codeWithName[1])) {
                const code = normalizeText(codeWithName[1]);
                const name = normalizeText(codeWithName[2]);
                return {
                    code,
                    codeKey: normalizeCourseCode(code),
                    name,
                    label: name ? `${code} - ${name}` : code
                };
            }

            if (looksLikeCourseCode(text)) {
                return {
                    code: text,
                    codeKey: normalizeCourseCode(text),
                    name: '',
                    label: text
                };
            }

            return {
                code: '',
                codeKey: '',
                name: '',
                label: text
            };
        }

        function parseEquivalentsList(value) {
            if (value === null || value === undefined) return [];

            if (Array.isArray(value)) {
                return value
                    .flatMap(item => parseEquivalentsList(item))
                    .filter(Boolean);
            }

            if (typeof value === 'string') {
                const parts = value.split(/[,\n;،]+/).map(x => normalizeText(x)).filter(Boolean);
                if (parts.length > 1) {
                    return parts
                        .map(part => parseEquivalentItem(part))
                        .filter(Boolean);
                }
                const parsed = parseEquivalentItem(value);
                return parsed ? [parsed] : [];
            }

            const parsed = parseEquivalentItem(value);
            return parsed ? [parsed] : [];
        }

        function ensureListMap(map, key) {
            if (!map.has(key)) {
                map.set(key, []);
            }
            return map.get(key);
        }

        function registerCourseInCatalog(codeRaw, nameRaw, nameEnRaw) {
            const codeKey = normalizeCourseCode(codeRaw);
            if (!codeKey) return '';

            const code = normalizeText(codeRaw) || codeKey;
            const name = normalizeText(nameRaw);
            const nameEn = normalizeText(nameEnRaw);
            const existing = courseCatalogByCode.get(codeKey);

            if (!existing) {
                courseCatalogByCode.set(codeKey, {
                    code,
                    name,
                    name_en: nameEn,
                    variants: name ? [{ code, name, name_en: nameEn }] : []
                });
                return codeKey;
            }

            const identityName = normalizeCourseIdentityName(name);
            const variantExists = (existing.variants || []).some(variant =>
                normalizeCourseIdentityName(variant.name) === identityName
            );
            if (identityName && !variantExists) {
                if (!Array.isArray(existing.variants)) existing.variants = [];
                existing.variants.push({ code, name, name_en: nameEn });
            }
            if (!existing.name && name) existing.name = name;
            if (!existing.name_en && nameEn) existing.name_en = nameEn;
            if (!existing.code && code) existing.code = code;
            return codeKey;
        }

        function dedupeEquivalentEntries(entries) {
            const map = new Map();
            (entries || []).forEach(entry => {
                if (!entry) return;
                const codeKey = normalizeCourseCode(entry.code || entry.codeKey || '');
                const label = normalizeText(entry.label || entry.code || '');
                const uniqueKey = codeKey ? `code:${codeKey}` : `label:${label.toLowerCase()}`;
                if (!label || !uniqueKey) return;
                if (!map.has(uniqueKey)) {
                    map.set(uniqueKey, {
                        code: normalizeText(entry.code || ''),
                        codeKey,
                        name: normalizeText(entry.name || ''),
                        label
                    });
                }
            });
            return Array.from(map.values());
        }

        function parseEquivalencyRule(rawRule, fallbackScope = {}) {
            if (!rawRule || typeof rawRule !== 'object' || Array.isArray(rawRule)) {
                return null;
            }

            const fallbackProgram = normalizeText(fallbackScope.program || '');
            const fallbackDegree = canonicalDegreeLabel(fallbackScope.degree || '');
            const fallbackPlanType = normalizeText(fallbackScope.plan_type || '');
            const fallbackVersion = normalizeText(fallbackScope.version || '');

            const program = normalizeText(rawRule.program || rawRule.program_name || fallbackProgram || '');
            const degree = canonicalDegreeLabel(rawRule.degree || fallbackDegree || '');
            const planType = normalizeText(rawRule.plan_type || rawRule.plan || fallbackPlanType || '');
            const version = normalizeText(rawRule.version || rawRule.plan_version || fallbackVersion || '');
            const note = normalizeText(rawRule.note || rawRule.notes || '');

            const optionsRaw =
                rawRule.options ??
                rawRule.equivalents ??
                rawRule.equivalent_courses ??
                rawRule.alternatives ??
                rawRule.any_of ??
                rawRule.courses ??
                rawRule.codes ??
                null;

            let options = parseEquivalentsList(optionsRaw);
            if (!options.length) {
                const single = parseEquivalentItem(rawRule);
                if (single && (single.codeKey || single.label)) {
                    options = [single];
                }
            }
            options = dedupeEquivalentEntries(options);
            if (!options.length) return null;

            return {
                program,
                degree,
                plan_type: planType,
                version,
                note,
                options
            };
        }

        function getEquivalencySourceName(rawRule, fallbackNameRaw = '') {
            if (!rawRule || typeof rawRule !== 'object' || Array.isArray(rawRule)) {
                return normalizeText(fallbackNameRaw);
            }

            const nestedSource = (
                rawRule.source_course && typeof rawRule.source_course === 'object'
                    ? rawRule.source_course
                    : (rawRule.source && typeof rawRule.source === 'object' ? rawRule.source : null)
            );
            const explicitSourceName = normalizeText(
                rawRule.source_course_name ??
                rawRule.source_name ??
                rawRule.sourceCourseName ??
                rawRule.course_name ??
                (nestedSource && (nestedSource.name ?? nestedSource.title)) ??
                ''
            );
            return explicitSourceName || normalizeText(fallbackNameRaw);
        }

        function getEquivalencySourceKey(codeRaw, sourceNameRaw = '') {
            const codeKey = normalizeCourseCode(codeRaw);
            if (!codeKey) return '';
            return normalizeCourseIdentityName(sourceNameRaw)
                ? getCourseIdentityKey(codeKey, sourceNameRaw)
                : codeKey;
        }

        function isCourseCodeIdentityAmbiguous(codeRaw) {
            const codeKey = normalizeCourseCode(codeRaw);
            const catalogEntry = codeKey ? courseCatalogByCode.get(codeKey) : null;
            const variants = catalogEntry && Array.isArray(catalogEntry.variants)
                ? catalogEntry.variants
                : [];
            return variants.length > 1;
        }

        function addEquivalencyRule(sourceCodeRaw, rawRule, fallbackScope = {}, sourceNameRaw = '') {
            const sourceName = getEquivalencySourceName(rawRule, sourceNameRaw);
            const sourceCodeKey = registerCourseInCatalog(sourceCodeRaw, sourceName, '');
            const sourceKey = getEquivalencySourceKey(sourceCodeKey, sourceName);
            if (!sourceKey) return;

            const parsedRule = parseEquivalencyRule(rawRule, fallbackScope);
            if (!parsedRule || !parsedRule.options.length) return;

            parsedRule.options = parsedRule.options
                .map(option => {
                    if (option.codeKey) {
                        registerCourseInCatalog(option.code || option.codeKey, option.name || '', '');
                    }
                    return option;
                })
                .filter(Boolean);

            if (!parsedRule.options.length) return;

            const signature = JSON.stringify({
                program: parsedRule.program,
                degree: parsedRule.degree,
                plan_type: parsedRule.plan_type,
                version: parsedRule.version,
                note: parsedRule.note,
                options: parsedRule.options.map(opt => ({
                    codeKey: opt.codeKey || '',
                    label: normalizeText(opt.label || '')
                }))
            });

            const rules = ensureListMap(equivalencyRulesBySource, sourceKey);
            if (rules.some(rule => rule.signature === signature)) return;

            rules.push({
                ...parsedRule,
                signature
            });
        }

        function addSimpleEquivalencyEntries(sourceCodeRaw, rawEntries, fallbackScope = {}, sourceNameRaw = '') {
            const entries = dedupeEquivalentEntries(parseEquivalentsList(rawEntries));
            if (!entries.length) return;
            addEquivalencyRule(sourceCodeRaw, { options: entries }, fallbackScope, sourceNameRaw);
        }

        function hasRuleScope(rule) {
            return Boolean(
                normalizeText(rule.program) ||
                normalizeText(rule.degree) ||
                normalizeText(rule.plan_type) ||
                normalizeText(rule.version)
            );
        }

        function normalizeContext(context = {}) {
            return {
                program: normalizeText(context.program || ''),
                degree: canonicalDegreeLabel(context.degree || ''),
                plan_type: normalizeText(context.plan_type || ''),
                version: normalizeText(context.version || '')
            };
        }

        function buildProgramContext(program) {
            if (!program || typeof program !== 'object') {
                return normalizeContext({});
            }
            return normalizeContext({
                program: program.name,
                degree: program.degree,
                plan_type: program.plan_type,
                version: program.version
            });
        }

        function ruleMatchesContext(rule, context = {}) {
            const normalizedContext = normalizeContext(context);

            if (normalizeText(rule.program) && normalizeText(rule.program) !== normalizedContext.program) {
                return false;
            }
            if (canonicalDegreeLabel(rule.degree) && canonicalDegreeLabel(rule.degree) !== normalizedContext.degree) {
                return false;
            }
            if (normalizeText(rule.plan_type) && normalizeText(rule.plan_type) !== normalizedContext.plan_type) {
                return false;
            }
            if (normalizeText(rule.version) && normalizeText(rule.version) !== normalizedContext.version) {
                return false;
            }

            return true;
        }

        function buildEquivalencyContextLabel(context = {}) {
            const normalizedContext = normalizeContext(context);
            const parts = [];

            if (normalizedContext.program) parts.push(normalizedContext.program);
            if (normalizedContext.degree) parts.push(normalizedContext.degree);
            if (normalizedContext.plan_type) {
                const planTypeLabel = normalizedContext.plan_type.startsWith('ال')
                    ? normalizedContext.plan_type
                    : `ال${normalizedContext.plan_type}`;
                parts.push(`الخطة ${planTypeLabel}`);
            }
            if (normalizedContext.version) parts.push(`إصدار ${normalizedContext.version}`);

            return parts.join(' | ') || 'جميع البرامج والخطط';
        }

        function formatEquivalentOption(entry) {
            if (!entry) return '';

            if (entry.codeKey) {
                const info = courseCatalogByCode.get(entry.codeKey);
                const code = normalizeText(entry.code || (info && info.code) || entry.codeKey);
                const inferredName = info && Array.isArray(info.variants)
                    ? (info.variants.length === 1 ? info.variants[0].name : '')
                    : (info && info.name);
                const name = normalizeText(entry.name || inferredName || '');
                if (code && name) return `${code} - ${name}`;
                return code || normalizeText(entry.label || '');
            }

            return normalizeText(entry.label || '');
        }

        function rebuildCourseIndexes() {
            courseCatalogByCode = new Map();
            equivalencyRulesBySource = new Map();

            if (!programsData || !Array.isArray(programsData.programs)) return;

            (programsData.courses_catalog || []).forEach(course => {
                registerCourseInCatalog(course.code, course.name, course.name_en);
            });

            programsData.programs.forEach(program => {
                (program.courses || []).forEach(course => {
                    registerCourseInCatalog(course.code, course.name, course.name_en);
                });
            });

            const globalEquivalencies = (
                programsData.equivalencies &&
                typeof programsData.equivalencies === 'object' &&
                !Array.isArray(programsData.equivalencies)
            ) ? programsData.equivalencies : {};

            Object.entries(globalEquivalencies).forEach(([sourceCode, rawEquivalents]) => {
                if (rawEquivalents && typeof rawEquivalents === 'object' && !Array.isArray(rawEquivalents)) {
                    const sourceName = getEquivalencySourceName(rawEquivalents);
                    if (Array.isArray(rawEquivalents.rules)) {
                        rawEquivalents.rules.forEach(rule => {
                            addEquivalencyRule(sourceCode, rule, {}, sourceName);
                        });
                    }

                    if (rawEquivalents.default !== undefined) {
                        addSimpleEquivalencyEntries(sourceCode, rawEquivalents.default, {}, sourceName);
                    }

                    addEquivalencyRule(sourceCode, rawEquivalents, {}, sourceName);
                    return;
                }

                if (Array.isArray(rawEquivalents)) {
                    rawEquivalents.forEach(item => {
                        if (item && typeof item === 'object' && !Array.isArray(item)) {
                            addEquivalencyRule(sourceCode, item, {});
                        } else {
                            addSimpleEquivalencyEntries(sourceCode, item, {});
                        }
                    });
                    return;
                }

                addSimpleEquivalencyEntries(sourceCode, rawEquivalents, {});
            });

            programsData.programs.forEach(program => {
                const programContext = buildProgramContext(program);

                (program.courses || []).forEach(course => {
                    registerCourseInCatalog(course.code, course.name, course.name_en);

                    const rawLocalEquivs = (
                        course.equivalents ??
                        course.equivalent_to ??
                        course.equivalent_courses ??
                        null
                    );

                    addSimpleEquivalencyEntries(course.code, rawLocalEquivs, programContext, course.name);

                    const rawLocalRules = course.equivalency_rules ?? course.equivalency_rule ?? null;
                    if (Array.isArray(rawLocalRules)) {
                        rawLocalRules.forEach(rule => addEquivalencyRule(course.code, rule, programContext, course.name));
                    } else if (rawLocalRules && typeof rawLocalRules === 'object') {
                        addEquivalencyRule(course.code, rawLocalRules, programContext, course.name);
                    }
                });
            });
        }

        function getEquivalentOptionsForContext(codeRaw, context = {}, sourceNameRaw = '') {
            const courseKey = normalizeCourseCode(codeRaw);
            if (!courseKey) return [];

            const labelsMap = new Map();
            const identityKey = getEquivalencySourceKey(courseKey, sourceNameRaw);
            const identityRules = identityKey !== courseKey
                ? (equivalencyRulesBySource.get(identityKey) || [])
                : [];
            const canUseLegacyCodeRules = !normalizeCourseIdentityName(sourceNameRaw) ||
                !isCourseCodeIdentityAmbiguous(courseKey);
            const rules = identityRules.length
                ? identityRules
                : (canUseLegacyCodeRules ? (equivalencyRulesBySource.get(courseKey) || []) : []);

            rules.forEach(rule => {
                if (!ruleMatchesContext(rule, context)) return;
                (rule.options || []).forEach(option => {
                    const label = formatEquivalentOption(option);
                    if (!label) return;
                    if (!labelsMap.has(label)) {
                        labelsMap.set(label, {
                            code: normalizeText(option.code || ''),
                            name: normalizeText(option.name || ''),
                            label
                        });
                    }
                });
            });

            return Array.from(labelsMap.values()).sort((a, b) => a.label.localeCompare(b.label, 'ar'));
        }

        function getEquivalentContextsForSearch(codeRaw, references, sourceNameRaw = '') {
            const courseKey = normalizeCourseCode(codeRaw);
            if (!courseKey) return [];

            const contextsMap = new Map();
            (references || []).forEach(ref => {
                const context = normalizeContext({
                    program: ref.program,
                    degree: ref.degree,
                    plan_type: ref.plan_type,
                    version: ref.version
                });
                const signature = JSON.stringify(context);
                if (contextsMap.has(signature)) return;

                const options = getEquivalentOptionsForContext(courseKey, context, sourceNameRaw);
                if (!options.length) return;

                contextsMap.set(signature, {
                    context_label: buildEquivalencyContextLabel(context),
                    options
                });
            });

            return Array.from(contextsMap.values());
        }

        function getCourseEquivalentEntries(course) {
            const raw = course
                ? (course.equivalents ?? course.equivalent_to ?? course.equivalent_courses ?? null)
                : null;
            return dedupeEquivalentEntries(parseEquivalentsList(raw));
        }

        function getCourseEquivalentInputValue(course) {
            return getCourseEquivalentEntries(course)
                .map(entry => {
                    if (entry.code) {
                        const code = normalizeText(entry.code);
                        const name = normalizeText(entry.name || '');
                        return name ? `${code} - ${name}` : code;
                    }
                    return normalizeText(entry.label || '');
                })
                .filter(Boolean)
                .join(' أو ');
        }

        function splitEquivalentsInput(rawValue) {
            const text = normalizeText(rawValue);
            if (!text) return [];

            return text
                .split(/(?:\s+أو\s+|\s+او\s+|[,\n;،|]+)/)
                .map(part => normalizeText(part))
                .filter(Boolean);
        }

        function saveCourseEquivalentEntries(course, entries) {
            const deduped = dedupeEquivalentEntries(entries);
            if (!deduped.length) {
                delete course.equivalents;
                delete course.equivalent_to;
                delete course.equivalent_courses;
                return;
            }

            course.equivalents = deduped.map(entry => {
                if (entry.code) {
                    const code = normalizeText(entry.code);
                    const name = normalizeText(entry.name || '');
                    return name ? `${code} - ${name}` : code;
                }
                return normalizeText(entry.label || '');
            }).filter(Boolean);

            delete course.equivalent_to;
            delete course.equivalent_courses;
        }

        function getEquivalencyStateKey(courseIndex) {
            return `${currentProgramIndex ?? -1}:${courseIndex}`;
        }

        function normalizeProgramIndexForEquivalency(value) {
            const parsed = Number(value);
            if (!Number.isInteger(parsed) || parsed < 0 || !programsData || !Array.isArray(programsData.programs)) {
                return (currentProgramIndex ?? 0);
            }
            if (parsed >= programsData.programs.length) {
                return (currentProgramIndex ?? 0);
            }
            return parsed;
        }

        function getEquivalencyState(courseIndex) {
            const key = getEquivalencyStateKey(courseIndex);
            if (!equivalencyUiState.has(key)) {
                equivalencyUiState.set(key, {
                    programIndex: normalizeProgramIndexForEquivalency(currentProgramIndex ?? 0),
                    search: '',
                    selectedCode: ''
                });
            }

            const state = equivalencyUiState.get(key);
            state.programIndex = normalizeProgramIndexForEquivalency(state.programIndex);
            if (typeof state.search !== 'string') state.search = '';
            if (typeof state.selectedCode !== 'string') state.selectedCode = '';
            return state;
        }

        function getProgramLabelForEquivalency(program) {
            const programName = normalizeText(program && program.name);
            const degree = canonicalDegreeLabel(program && program.degree);
            const planType = normalizeText(program && program.plan_type);
            const version = normalizeText(program && program.version);
            const parts = [programName, degree];
            if (planType) parts.push(`الخطة ${planType}`);
            if (version) parts.push(`إصدار ${version}`);
            return parts.filter(Boolean).join(' | ');
        }

        function getEquivalentCourseCandidates(courseIndex) {
            const state = getEquivalencyState(courseIndex);
            const sourceProgram = getCurrentProgram();
            const sourceCourse = sourceProgram && sourceProgram.courses ? sourceProgram.courses[courseIndex] : null;
            const sourceKey = normalizeCourseCode(sourceCourse && sourceCourse.code);

            const targetProgram = programsData && programsData.programs ? programsData.programs[state.programIndex] : null;
            if (!targetProgram || !Array.isArray(targetProgram.courses)) return [];

            const query = normalizeText(state.search).toLowerCase();
            const deduped = new Map();

            targetProgram.courses.forEach(candidate => {
                const code = normalizeText(candidate.code);
                const codeKey = normalizeCourseCode(code);
                if (!codeKey) return;
                if (sourceKey && codeKey === sourceKey) return;
                if (deduped.has(codeKey)) return;

                const name = normalizeText(candidate.name);
                const nameEn = normalizeText(candidate.name_en);
                const haystack = `${code} ${name} ${nameEn}`.toLowerCase();
                if (query && !haystack.includes(query)) return;

                deduped.set(codeKey, {
                    code,
                    codeKey,
                    name,
                    name_en: nameEn
                });
            });

            return Array.from(deduped.values()).sort((a, b) => a.code.localeCompare(b.code, 'en'));
        }

        function renderEquivalentCourseOptionsHtml(courseIndex) {
            const state = getEquivalencyState(courseIndex);
            const candidates = getEquivalentCourseCandidates(courseIndex);

            if (!candidates.length) {
                return '<option value="">لا توجد مقررات مطابقة</option>';
            }

            const options = candidates.map(item => {
                const selected = state.selectedCode === item.codeKey ? 'selected' : '';
                const label = item.name ? `${item.code} - ${item.name}` : item.code;
                return `<option value="${escapeHtml(item.codeKey)}" ${selected}>${escapeHtml(label)}</option>`;
            }).join('');

            return `<option value="">اختر المقرر المعادل...</option>${options}`;
        }

        function refreshEquivalentCourseOptions(courseIndex) {
            const state = getEquivalencyState(courseIndex);
            const selectId = `equivCourseSelect-${currentProgramIndex}-${courseIndex}`;
            const select = document.getElementById(selectId);
            if (!select) return;

            select.innerHTML = renderEquivalentCourseOptionsHtml(courseIndex);

            if (state.selectedCode) {
                const exists = Array.from(select.options).some(option => option.value === state.selectedCode);
                if (exists) {
                    select.value = state.selectedCode;
                } else {
                    state.selectedCode = '';
                    select.value = '';
                }
            } else {
                select.value = '';
            }
        }

        function setEquivalentProgramFilter(courseIndex, programIndexValue) {
            const state = getEquivalencyState(courseIndex);
            state.programIndex = normalizeProgramIndexForEquivalency(programIndexValue);
            state.search = '';
            state.selectedCode = '';

            const searchId = `equivCourseSearch-${currentProgramIndex}-${courseIndex}`;
            const searchInput = document.getElementById(searchId);
            if (searchInput) searchInput.value = '';

            refreshEquivalentCourseOptions(courseIndex);
        }

        function setEquivalentSearchFilter(courseIndex, queryValue) {
            const state = getEquivalencyState(courseIndex);
            state.search = normalizeText(queryValue);
            state.selectedCode = '';
            refreshEquivalentCourseOptions(courseIndex);
        }

        function setEquivalentCandidate(courseIndex, codeKeyValue) {
            const state = getEquivalencyState(courseIndex);
            state.selectedCode = normalizeCourseCode(codeKeyValue);
        }

        function addEquivalentFromPicker(courseIndex) {
            const program = getCurrentProgram();
            if (!program || !program.courses || !program.courses[courseIndex]) return;

            const state = getEquivalencyState(courseIndex);
            const selectedCodeKey = normalizeCourseCode(state.selectedCode);
            if (!selectedCodeKey) return;

            const candidates = getEquivalentCourseCandidates(courseIndex);
            const selectedCandidate = candidates.find(item => item.codeKey === selectedCodeKey);
            if (!selectedCandidate) return;

            const course = program.courses[courseIndex];
            const entries = getCourseEquivalentEntries(course);
            const exists = entries.some(entry => normalizeCourseCode(entry.code || entry.codeKey || '') === selectedCandidate.codeKey);
            if (exists) return;

            entries.push({
                code: selectedCandidate.code,
                codeKey: selectedCandidate.codeKey,
                name: selectedCandidate.name,
                label: selectedCandidate.name ? `${selectedCandidate.code} - ${selectedCandidate.name}` : selectedCandidate.code
            });

            saveCourseEquivalentEntries(course, entries);
            state.selectedCode = '';
            applyProgramMutation();
        }

        function removeEquivalentByIndex(courseIndex, entryIndex) {
            const program = getCurrentProgram();
            if (!program || !program.courses || !program.courses[courseIndex]) return;

            const course = program.courses[courseIndex];
            const entries = getCourseEquivalentEntries(course);
            if (entryIndex < 0 || entryIndex >= entries.length) return;

            entries.splice(entryIndex, 1);
            saveCourseEquivalentEntries(course, entries);
            applyProgramMutation();
        }

        function renderEquivalencyEditor(course, courseIndex) {
            const state = getEquivalencyState(courseIndex);
            const currentEntries = getCourseEquivalentEntries(course);

            const programOptionsHtml = (programsData && Array.isArray(programsData.programs)
                ? programsData.programs
                : []
            ).map((program, index) => {
                const selected = state.programIndex === index ? 'selected' : '';
                return `<option value="${index}" ${selected}>${escapeHtml(getProgramLabelForEquivalency(program))}</option>`;
            }).join('');

            const selectedChipsHtml = currentEntries.length
                ? currentEntries.map((entry, entryIndex) => {
                    const label = formatEquivalentOption(entry);
                    return `
                        <span class="selected-equivalent-chip">
                            <span>${escapeHtml(label)}</span>
                            <button type="button" class="remove-equivalent-btn" onclick="removeEquivalentByIndex(${courseIndex}, ${entryIndex})">×</button>
                        </span>
                    `;
                }).join('')
                : '<span class="selected-equivalent-empty">لا توجد معادلات محددة بعد</span>';

            return `
                <div class="equivalency-editor">
                    <input class="edit-input" value="${escapeHtml(getCourseEquivalentInputValue(course))}" placeholder="إدخال يدوي: 2001001-3 أو 2001002-3" onchange="setCourseEquivalents(${courseIndex}, this.value)">
                    <div class="equivalency-builder">
                        <select class="edit-select" onchange="setEquivalentProgramFilter(${courseIndex}, this.value)">
                            ${programOptionsHtml}
                        </select>
                        <input id="equivCourseSearch-${currentProgramIndex}-${courseIndex}" class="edit-input" value="${escapeHtml(state.search)}" placeholder="ابحث داخل مقررات البرنامج..." oninput="setEquivalentSearchFilter(${courseIndex}, this.value)">
                        <div class="equivalency-builder-actions">
                            <select id="equivCourseSelect-${currentProgramIndex}-${courseIndex}" class="edit-select" onchange="setEquivalentCandidate(${courseIndex}, this.value)">
                                ${renderEquivalentCourseOptionsHtml(courseIndex)}
                            </select>
                            <button type="button" class="mini-btn mini-btn-add" onclick="addEquivalentFromPicker(${courseIndex})">إضافة معادلة</button>
                        </div>
                    </div>
                    <div class="selected-equivalents-list">${selectedChipsHtml}</div>
                </div>
            `;
        }

        function canonicalDegreeLabel(degree) {
            const d = normalizeText(degree);
            if (d.includes('بكال')) return 'بكالوريوس';
            if (d.includes('ماجست')) return 'ماجستير';
            if (d.includes('دكتور')) return 'دكتوراه';
            return d;
        }

        function requirementFromCategory(category) {
            const cat = normalizeText(category);
            if (!cat) return 'غير محدد';
            return cat.includes('اختياري') ? 'اختياري' : 'إجباري';
        }

        function chipClassForPlans(planTypes) {
            const set = new Set((planTypes || []).filter(Boolean));
            if (set.size > 1) return 'plan-mixed';
            const only = Array.from(set)[0];
            if (only === 'جديدة') return 'plan-new';
            if (only === 'قديمة') return 'plan-old';
            return '';
        }

        function groupProgramsForCourse(occurrences) {
            const map = new Map();
            (occurrences || []).forEach(o => {
                const key = `${normalizeText(o.program)}||${canonicalDegreeLabel(o.degree)}`;
                if (!map.has(key)) {
                    map.set(key, {
                        program: normalizeText(o.program),
                        degree: canonicalDegreeLabel(o.degree),
                        planTypes: new Set()
                    });
                }
                if (o.plan_type) map.get(key).planTypes.add(o.plan_type);
            });
            return Array.from(map.values()).map(x => ({
                program: x.program,
                degree: x.degree,
                plan_types: Array.from(x.planTypes)
            }));
        }

        function sanitizeDataShape(data) {
            if (!data || typeof data !== 'object') return { programs: [] };
            if (!Array.isArray(data.programs)) data.programs = [];
            if (!Array.isArray(data.courses_catalog)) data.courses_catalog = [];
            if (!data.equivalencies || typeof data.equivalencies !== 'object' || Array.isArray(data.equivalencies)) {
                data.equivalencies = {};
            }
            if (!data.course_details || typeof data.course_details !== 'object' || Array.isArray(data.course_details)) {
                data.course_details = {};
            }
            data.programs.forEach(program => {
                if (!Array.isArray(program.courses)) {
                    program.courses = [];
                }
            });
            return data;
        }

        function readStoredData(fallbackData) {
            try {
                const fallback = sanitizeDataShape(deepClone(fallbackData));
                const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (!raw) return fallback;
                const parsed = JSON.parse(raw);
                sanitizeDataShape(parsed);
                parsed.course_details = deepClone(fallback.course_details);
                parsed.courses_catalog = deepClone(fallback.courses_catalog);
                parsed.equivalencies = {
                    ...deepClone(fallback.equivalencies),
                    ...parsed.equivalencies
                };
                return parsed;
            } catch (error) {
                console.warn('Stored data ignored:', error);
                localStorage.removeItem(LOCAL_STORAGE_KEY);
                return sanitizeDataShape(deepClone(fallbackData));
            }
        }

        function saveCustomData() {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(programsData));
            } catch (error) {
                console.warn('Could not save custom data:', error);
            }
        }

        function clearCustomData() {
            localStorage.removeItem(LOCAL_STORAGE_KEY);
        }

        function clearLegacyCustomData() {
            LEGACY_LOCAL_STORAGE_KEYS.forEach(key => {
                try {
                    localStorage.removeItem(key);
                } catch (error) {
                    console.warn('Could not clear legacy stored data:', error);
                }
            });
        }

        function isCountedElectivePlaceholder(course) {
            const text = `${normalizeText(course && course.name)} ${normalizeText(course && course.category)}`;
            return /(?:جامعي|جامعة|كلية|برنامج)\s*اختياري|اختياري\s*(?:جامعي|جامعة|كلية|برنامج)/.test(text);
        }

        function isOutsideLevelElective(course) {
            if (!course || typeof course !== 'object') return false;
            if (course.optional_pool === true) return true;
            if (course.optional_pool === false) return false;
            const category = normalizeText(course.category);
            if (!category.includes('اختيار')) return false;
            return !isCountedElectivePlaceholder(course);
        }

        function getCourseTypeClass(type) {
            if (type === 'عملي') return 'type-practical';
            if (type === 'بحث') return 'type-research';
            if (type === 'تدريب') return 'type-training';
            return 'type-theory';
        }

        function getLevelTitle(level) {
            const map = {
                1: 'المستوى الأول',
                2: 'المستوى الثاني',
                3: 'المستوى الثالث',
                4: 'المستوى الرابع',
                5: 'المستوى الخامس',
                6: 'المستوى السادس',
                7: 'المستوى السابع',
                8: 'المستوى الثامن',
                9: 'المستوى التاسع',
                10: 'المستوى العاشر',
                11: 'المستوى الحادي عشر',
                12: 'المستوى الثاني عشر'
            };
            return map[level] || `المستوى ${level}`;
        }

        function levelOptionsHtml(selectedLevel) {
            const current = Math.max(1, Math.round(toNumber(selectedLevel, 1)));
            let options = '';
            for (let level = 1; level <= MAX_LEVEL; level += 1) {
                options += `<option value="${level}" ${current === level ? 'selected' : ''}>${level}</option>`;
            }
            return options;
        }

        function getCurrentProgram() {
            if (currentProgramIndex === null || !programsData || !Array.isArray(programsData.programs)) {
                return null;
            }
            currentProgram = programsData.programs[currentProgramIndex] || null;
            return currentProgram;
        }

        function requestEditAccess() {
            if (editAccessGranted) return true;
            const entered = window.prompt('أدخل كلمة المرور لتفعيل التعديل:');
            if (entered === null) return false;
            if (normalizePasswordInput(entered) !== normalizePasswordInput(EDIT_PASSWORD)) {
                alert('كلمة المرور غير صحيحة');
                return false;
            }
            editAccessGranted = true;
            return true;
        }

        function updateFloatingEditButton() {
            const btn = document.getElementById('floatingEditBtn');
            const label = document.getElementById('floatingEditBtnLabel');
            if (!btn || !label) return;
            btn.classList.toggle('active', quickEditModeEnabled);
            btn.title = quickEditModeEnabled ? 'إيقاف وضع التعديل' : 'تفعيل وضع التعديل';
            label.textContent = quickEditModeEnabled ? 'إيقاف التعديل' : 'وضع التعديل';
        }

        function setQuickEditState(nextState) {
            quickEditModeEnabled = Boolean(nextState);
            if (!quickEditModeEnabled) {
                highlightedCourseIndex = null;
            }
            updateFloatingEditButton();

            const modal = document.getElementById('modalOverlay');
            if (modal && modal.classList.contains('active') && getCurrentProgram()) {
                editModeEnabled = quickEditModeEnabled;
                renderCurrentProgramModal();
            }
        }

        function toggleFloatingEditMode() {
            if (quickEditModeEnabled) {
                setQuickEditState(false);
                return;
            }
            if (!requestEditAccess()) return;
            setQuickEditState(true);
        }

        function ensureQuickEditEnabled() {
            if (quickEditModeEnabled) return true;
            if (!requestEditAccess()) return false;
            setQuickEditState(true);
            return true;
        }

        function applyProgramMutation() {
            rebuildCourseIndexes();
            saveCustomData();
            updateStats();
            renderPrograms(activeDegreeFilter);
            const modal = document.getElementById('modalOverlay');
            if (modal.classList.contains('active')) {
                renderCurrentProgramModal();
            }
        }

        window.addEventListener('scroll', () => {
            const statsBar = document.getElementById('statsBar');
            if (window.scrollY > 100) {
                statsBar.classList.add('scrolled');
            } else {
                statsBar.classList.remove('scrolled');
            }
        });

        async function loadData() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                sanitizeDataShape(data);
                clearLegacyCustomData();
                originalProgramsData = deepClone(data);
                programsData = readStoredData(data);
                sanitizeDataShape(programsData);
                rebuildCourseIndexes();
                initializeUI();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('programsGrid').innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">⚠️</div>
                        <p>حدث خطأ في تحميل البيانات</p>
                    </div>
                `;
            }
        }

        function updateStats() {
            if (!programsData || !Array.isArray(programsData.programs)) return;
            const totalCourses = programsData.programs.reduce((sum, p) => {
                return sum + ((p.courses && p.courses.length) ? p.courses.length : 0);
            }, 0);
            const uniqueProgramKeys = new Set(
                programsData.programs.map(p => `${normalizeText(p.name)}||${canonicalDegreeLabel(p.degree)}`)
            );
            const uniqueDegrees = new Set(
                programsData.programs.map(p => canonicalDegreeLabel(p.degree))
            );
            document.getElementById('programsCount').textContent = uniqueProgramKeys.size;
            document.getElementById('coursesCount').textContent = totalCourses;
            document.getElementById('degreesCount').textContent = uniqueDegrees.size;
        }

        function initializeUI() {
            if (!programsData || !Array.isArray(programsData.programs)) return;
            updateStats();
            updateFloatingEditButton();
