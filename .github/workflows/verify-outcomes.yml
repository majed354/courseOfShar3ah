name: Verify course outcomes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile extraction and verification scripts
        run: python3 -m py_compile scripts/extract_course_outcomes.py scripts/verify_course_outcomes.py
      - name: Verify pinned course outcomes
        run: python3 scripts/verify_course_outcomes.py
